    const grid=document.getElementById('grid'),screen=grid?.parentElement;
    if(!screen)return;
    const focused=grid.contains(document.activeElement);
    const gridRect=grid.getBoundingClientRect(),screenRect=screen.getBoundingClientRect();
    const step=grid.firstElementChild.offsetWidth+1;
    const center={x:(screenRect.left+screen.clientLeft+screen.clientWidth/2-gridRect.left-4)/step,y:(screenRect.top+screen.clientTop+screen.clientHeight/2-gridRect.top-4)/step};
    this._largeTiles=!this._largeTiles;writeStored('sweeper_largeTiles',this._largeTiles);
    this.renderBoard();
    const nextGrid=document.getElementById('grid'),nextScreen=nextGrid.parentElement;
    const nextGridRect=nextGrid.getBoundingClientRect(),nextScreenRect=nextScreen.getBoundingClientRect();
    const nextStep=nextGrid.firstElementChild.offsetWidth+1;
    nextScreen.scrollLeft+=nextGridRect.left+4+center.x*nextStep-(nextScreenRect.left+nextScreen.clientLeft+nextScreen.clientWidth/2);
    nextScreen.scrollTop+=nextGridRect.top+4+center.y*nextStep-(nextScreenRect.top+nextScreen.clientTop+nextScreen.clientHeight/2);
    if(!focused)document.getElementById('btn-tile-size').focus({preventScroll:true});
  }

  renderBoard(){
    clearTimeout(this._boardHoldTimer);this._boardHoldTimer=null;
    const g=this.game;
    const priorGrid=document.getElementById('grid');
    const keepFocus=!!priorGrid?.contains(document.activeElement);
    const oldScreen=priorGrid?.parentElement;
    const scroll=oldScreen?.classList.contains('board-paused')&&this._pausedBoardScroll?this._pausedBoardScroll:{left:oldScreen?.scrollLeft||0,top:oldScreen?.scrollTop||0};
    if(this._paused)this._pausedBoardScroll=scroll;
    const wrapEl=this.root.querySelector('.exe-wrap');
    const winWidth=Math.min(720,wrapEl.clientWidth-(window.innerWidth<=700?12:110));
    this._largeTiles??=readStored('sweeper_largeTiles',false)===true;
    const cellSize=this._largeTiles?44:Math.max(28,Math.min(44,Math.floor((winWidth-42-g.cols)/g.cols),Math.floor((wrapEl.clientHeight-340)/g.rows)));

    let powerupsHTML='';
    if(g.powerups.length>0){
      const PMAP={timewarp:{cls:'timewarp',glyph:ICONS.time_glyph,label:'BACKUP'},shield:{cls:'shield',glyph:ICONS.shield_glyph,label:'FIREWALL'},compass:{cls:'compass',glyph:ICONS.compass_glyph,label:'SCANDISK'},oracle:{cls:'oracle',glyph:ICONS.oracle_glyph,label:'DEFRAG'},rewind:{cls:'rewind',glyph:ICONS.rewind_glyph,label:'REWIND'},lantern:{cls:'lantern',glyph:ICONS.lantern_glyph,label:'TRACERT'},hex:{cls:'cursed',glyph:ICONS.hex_glyph,label:'SPYWARE'},tithe:{cls:'cursed',glyph:ICONS.tithe_glyph,label:'TROJAN'},bargain:{cls:'cursed',glyph:ICONS.bargain_glyph,label:'ADWARE'},scapegoat:{cls:'cursed',glyph:ICONS.scapegoat_glyph,label:'BLOATWARE'},pyre:{cls:'cursed',glyph:ICONS.pyre_glyph,label:'ROOTKIT'}};
      powerupsHTML=g.powerups.map((p,i)=>{
        const m=PMAP[p]||PMAP.timewarp;
        return`<button class="powerup-badge ${m.cls}" data-powerup="${p}" data-idx="${i}" title="${GAME_TOOLS[p]?.desc||m.label}" ${this._paused||g.gameOver?'disabled':''}>${m.label}${p==='shield'?' · passive':''}</button>`;
      }).join('');
    }

    const timerPct=g.maxTime>0?(g.timeRemaining/g.maxTime*100):100;
    const isLow=g.timeRemaining<=15;

    const runesHTML=Array.from({length:g.totalDepths},(_,i)=>{
      const cls=i<g.level?'completed':i===g.level?'active':'';
      return`<div class="level-rune ${cls}">${ICONS.runes[i]}</div>`;
    }).join('');

    let modBarHTML='';
    const badges=[];
    if(g.modifiers.length>0)badges.push(...g.modifiers.map(m=>`<button class="modifier-badge" type="button" data-modifier="${m.id}" title="${m.desc}"><span class="mg">${m.icon}</span>${m.name}${m.id==='surge'&&g.surged?' · 1.25×':''}</button>`));
    if(badges.length>0)modBarHTML=`<div class="modifier-bar">${badges.join('')}</div>`;

    const depthStr=String(g.level+1).padStart(2,'0');
    const totalStr=String(g.totalDepths).padStart(2,'0');
    const sessionStr=String(parseInt(localStorage.getItem('sweeper_sessions')||'47',10)).padStart(5,'0');
    const winHTML=`
    <div class="exe-titlebar">
      <div class="exe-ttext"><span class="exe-ic">S</span>SWEEPER.EXE · ${g.dailyDate?'Daily '+g.dailyDate:'Level '+(g.level+1)+' of '+g.totalDepths}</div>
      <div class="exe-tbtns"><button class="exe-tbtn exe-close-btn" title="Close window" aria-label="Close">&times;</button></div>
    </div>
    <div class="status-bar">
      <div class="status-item"><span class="status-label">${g.dailyDate?'Board':'Level'}</span><span class="status-value accent">${g.dailyDate?'Daily':depthStr}</span></div>
      <div class="status-item"><span class="status-label">${g.dailyDate?'Cleared':'Keys'}</span><span class="status-value accent" id="shard-val">${g.dailyDate?g.board.flat().filter(c=>c.revealed&&!c.mine).length:g.shards}</span></div>
      <div class="status-item"><span class="status-label">Time</span><span class="status-value ${isLow?'danger-text':'accent'}" id="timer-val">${this.fmtTime(g.timeRemaining)}</span></div>
      <div class="status-item"><span class="status-label">Mines left</span><span class="status-value" id="mines-val">${g.mineCount-g.flagCount}</span></div>
    </div>
    <div class="level-bar">${g.dailyDate?`<span class="daily-attempt-label">${g.dailyAttempt>1?'Practice · attempt '+g.dailyAttempt:g.dailyAttempt===1?'First attempt':'Begin at the marked tile'}</span>`:`<div class="exe-stage-list">${runesHTML}</div>`}<button class="exe-board-size" id="btn-tile-size" aria-pressed="${this._largeTiles}" title="Use larger tiles. Drag the board to move around it.">Larger tiles</button></div>
    ${modBarHTML}
    <div class="timer-bar-wrap"><div class="timer-bar ${isLow?'low':''}" id="timer-bar" style="width:${timerPct}%"></div></div>
    <div class="powerup-bar" id="powerup-bar">${powerupsHTML}</div>
    <div class="game-screen"><div class="grid" id="grid" role="grid" aria-label="Minesweeper board" style="grid-template-columns:repeat(${g.cols},${cellSize}px);gap:1px;padding:4px;"></div></div>
    <div class="controls">
      <div class="exe-control-group" aria-label="Tile action"><button class="btn" id="btn-reveal" aria-pressed="${this.inputMode==='reveal'}">Reveal</button><button class="btn" id="btn-flag" aria-pressed="${this.inputMode==='flag'}">Flag</button><button class="btn" id="btn-inspect" aria-pressed="${this.inputMode==='inspect'}">Inspect</button></div>
      <div class="exe-control-group"><button class="btn" id="btn-pause">${g.gameOver?'Results':this._paused?'Resume':'Pause'}</button>${g.dailyDate?'<button class="btn" id="btn-daily-link">Copy link</button>':`<button class="btn" id="btn-save" ${g.gameOver?'disabled':''}>Save</button>`}<button class="btn" id="btn-new">Menu</button></div>
    </div>
    <div class="exe-board-hint" id="board-hint" role="status" aria-live="polite">${this.boardHint()}</div>
    <div class="exe-status"><div class="exe-sb-cell">${g.dailyDate?'Daily · UTC':classById(g.gameClass).name}</div><div class="exe-sb-cell" id="exe-sb-msg">${this._paused?'Paused':g.firstClick?'Ready':g.gameOver?'Run ended':'Autosaved in this browser'}</div><div class="exe-sb-cell">${g.rows} × ${g.cols}</div></div>`;
    const win=this._renderWin('sweeper',winHTML);
    win.classList.add('exe-game-window');

    this.container.classList.toggle('danger',isLow&&!g.gameOver);

    const grid=win.querySelector('#grid');
    for(let r=0;r<g.rows;r++){
      for(let c=0;c<g.cols;c++){
        const cell=g.board[r][c];
        const el=document.createElement('div');
        el.style.width=cellSize+'px';el.style.height=cellSize+'px';
        el.style.fontSize=Math.max(cellSize*0.42,10)+'px';
        el.dataset.r=r;el.dataset.c=c;
        el.setAttribute('role','gridcell');
        el.tabIndex=r===this._focusCell.r&&c===this._focusCell.c?0:-1;
        el.setAttribute('aria-rowindex',r+1);el.setAttribute('aria-colindex',c+1);
        this.applyCellClass(el,cell,r,c);
        grid.appendChild(el);
      }
    }

    let touch=null,suppressTouchClick=false;
    const cancelTouch=(suppressClick=false)=>{clearTimeout(this._boardHoldTimer);this._boardHoldTimer=null;if(suppressClick){suppressTouchClick=true;this._ignoreTouchClickUntil=Date.now()+750;}};
    grid.addEventListener('click',e=>{if(Date.now()<(this._ignoreTouchClickUntil||0)){e.preventDefault();return;}const t=this.getCellEl(e);if(!t)return;if(this.inputMode==='inspect'||g.gameOver){this.inspectCell(t.r,t.c);return;}this.inputMode==='flag'?this.handleRightClick(e):this.handleClick(e);});
    grid.addEventListener('contextmenu',e=>{e.preventDefault();if(Date.now()>=(this._ignoreTouchClickUntil||0))this.handleRightClick(e);});
    grid.addEventListener('touchstart',e=>{
      cancelTouch();touch=null;suppressTouchClick=false;
      if(e.touches.length!==1){cancelTouch(true);return;}
      if(this.inputMode==='inspect'||g.gameOver||this._paused||!this.getCellEl(e))return;
      const first=e.touches[0];touch={x:first.clientX,y:first.clientY,id:first.identifier,held:false};
      this._boardHoldTimer=setTimeout(()=>{
        if(!grid.isConnected||this.game!==g||this._paused||!touch)return;
        touch.held=true;cancelTouch(true);this.handleRightClick(e);
      },450);
    },{passive:true});
    grid.addEventListener('touchmove',e=>{
      if(!touch)return;
      const point=e.touches[0];
      if(e.touches.length!==1||point.identifier!==touch.id||Math.hypot(point.clientX-touch.x,point.clientY-touch.y)>8){cancelTouch(true);touch=null;}
    },{passive:true});
    grid.addEventListener('touchend',()=>{cancelTouch(suppressTouchClick||touch?.held===true);touch=null;suppressTouchClick=false;},{passive:true});
    grid.addEventListener('touchcancel',()=>{cancelTouch(true);touch=null;},{passive:true});
    win.ontouchstart=e=>{if(e.touches.length>1){cancelTouch(true);touch=null;}};
    grid.addEventListener('focusin',e=>{const cell=e.target.closest('.cell');if(!cell)return;this._focusCell={r:+cell.dataset.r,c:+cell.dataset.c};grid.querySelectorAll('.cell').forEach(el=>{el.tabIndex=el===cell?0:-1;});this.inspectCell(+cell.dataset.r,+cell.dataset.c);});
    grid.addEventListener('pointerover',e=>{if(e.pointerType==='touch')return;const t=this.getCellEl(e);if(t)this.inspectCell(t.r,t.c);});
    grid.addEventListener('pointerleave',()=>{if(this.inputMode!=='inspect')this.clearInspection();});
    grid.addEventListener('focusout',e=>{if(!grid.contains(e.relatedTarget)&&this.inputMode!=='inspect')this.clearInspection();});
    grid.addEventListener('keydown',e=>{
      const el=e.target.closest('.cell');if(!el)return;
      const r=+el.dataset.r,c=+el.dataset.c,cols=g.cols,rows=g.rows;
      let nr=r,nc=c;
      if(e.key==='ArrowUp')nr=Math.max(0,r-1);
      else if(e.key==='ArrowDown')nr=Math.min(rows-1,r+1);
      else if(e.key==='ArrowLeft')nc=Math.max(0,c-1);
      else if(e.key==='ArrowRight')nc=Math.min(cols-1,c+1);
      else if(e.key==='Enter'||e.key===' '){e.preventDefault();if(this.inputMode==='inspect'||g.gameOver)this.inspectCell(r,c);else if(this.inputMode==='flag')this.handleRightClick(e);else this.handleClick(e);return;}
      else if(e.key.toLowerCase()==='f'){e.preventDefault();this.handleRightClick(e);return;}
      else return;
      e.preventDefault();grid.children[nr*cols+nc]?.focus();
    });
    win.querySelector('#btn-new').addEventListener('click',()=>{this.pauseGame();this._autosave();this.showStart();});
    win.querySelector('#btn-tile-size').addEventListener('click',()=>this._toggleTileSize());
    win.querySelector('#btn-save')?.addEventListener('click',()=>this.saveGame());
    win.querySelector('#btn-daily-link')?.addEventListener('click',e=>this._copyDaily(this._dailyLink(g.dailyDate),e.currentTarget));
    win.querySelector('#btn-pause').addEventListener('click',()=>g.gameOver?(g.gameWon?this.showLevelComplete():this.showGameOver()):this._paused?this.resumeGame():this.pauseGame());
    for(const mode of ['reveal','flag','inspect'])win.querySelector('#btn-'+mode).addEventListener('click',()=>{this.inputMode=mode;this.renderBoard();});
    win.querySelectorAll('[data-modifier]').forEach(el=>el.addEventListener('click',()=>{win.querySelector('#board-hint').textContent=MODIFIERS.find(m=>m.id===el.dataset.modifier).desc;}));
    win.querySelectorAll('.powerup-badge').forEach(el=>el.addEventListener('click',()=>this.usePowerup(el.dataset.powerup)));
    if(this._paused&&!g.gameOver){
      win.querySelector('.game-screen').classList.add('board-paused');
      const cover=document.createElement('div');cover.className='exe-pause';
      cover.innerHTML='<h2>Paused</h2><p>Your board is saved. Pick up where you left off.</p><button class="exe-btn default" id="resume-game">Resume game</button><button class="exe-btn" id="pause-home">Back to menu</button>';
      cover.style.top=win.querySelector('.exe-titlebar').offsetHeight+'px';
      win.appendChild(cover);
      for(const child of win.children){if(child!==cover&&!child.classList.contains('exe-titlebar'))child.inert=true;}
      cover.querySelector('#resume-game').addEventListener('click',()=>this.resumeGame());
      cover.querySelector('#pause-home').addEventListener('click',()=>{this._autosave();this.showStart();});
      cover.querySelector('#resume-game').focus({preventScroll:true});
    }
    grid.parentElement.scrollLeft=this._paused?0:scroll.left;grid.parentElement.scrollTop=this._paused?0:scroll.top;
    if(g.dailyDate&&g.firstClick&&!this._paused){
      const start=grid.querySelector('.daily-start');
      if(start){grid.parentElement.scrollTop=start.offsetTop-(grid.parentElement.clientHeight-start.offsetHeight)/2;grid.parentElement.scrollLeft=start.offsetLeft-(grid.parentElement.clientWidth-start.offsetWidth)/2;}
    }
    if(keepFocus&&!this._paused)grid.querySelector('[tabindex="0"]')?.focus({preventScroll:true});
    this._autosave();
  }

  applyCellClass(el,cell,r,c){
    el.className='cell';
    const g=this.game;
    const review=g.gameOver&&!g.gameWon;
    if(review&&cell.flagged){
      el.classList.add(cell.mine?'flagged':'wrong-flag');el.innerHTML=cell.mine?ICONS.stake:'×';
      el.setAttribute('aria-label',cell.mine?'Correct flag on a mine':'Incorrect flag: safe tile');
      if(g.hitCell?.r===r&&g.hitCell?.c===c)el.classList.add('mine-hit');
      return;
    }
    if(cell.revealed||review){
      if(cell.dead){el.classList.add('revealed');el.textContent='·';el.setAttribute('aria-label','Dead tile: no number information');return;}
      if(cell.mine){
        const hit=g.hitCell?.r===r&&g.hitCell?.c===c;
        el.classList.add(hit?'mine-hit':'review-mine');el.innerHTML=ICONS.skull;
        el.setAttribute('aria-label',hit?'Mine that ended the run':'Mine');
      }else{
        el.classList.add('revealed');
        const displayN=g.displayAdjacent(cell);
        let shown='';
        if(displayN>0){
          const isCryptic=!review&&g.hasModifier('cryptic')&&displayN>=4;
          const val=isCryptic?'?':displayN;
          const color=isCryptic?'var(--text-muted)':NUM_COLORS[displayN];
          shown=`<span class="num-display" style="color:${color};text-shadow:0 0 6px ${color}33">${val}</span>`;
        }
        el.innerHTML=shown;
        el.setAttribute('aria-label',!review&&g.hasModifier('cryptic')&&displayN>=4?'Hidden number':displayN>0?displayN+' adjacent':'Empty');
        if(review&&!cell.revealed)el.classList.add('review-safe');
        if(!review&&g.hasModifier('echo')&&displayN>0){
          el.classList.add('echo-fade');
          el.querySelector('.num-display').style.animationDelay=-Math.min(10000,Math.max(0,Date.now()-(cell.revealedAt||0)))+'ms';
        }
      }
    }else if(cell.flagged){
      el.classList.add('flagged');el.innerHTML=ICONS.stake;
      el.setAttribute('aria-label','Flagged');
    }else{
      el.classList.add('unrevealed');
      el.innerHTML=this._cheats.mines&&cell.mine?ICONS.skull:'';
      el.setAttribute('aria-label','Unrevealed');
      if(g.dailyDate&&g.firstClick&&r===DAILY_BOARD.startRow&&c===DAILY_BOARD.startCol){el.classList.add('daily-start');el.textContent='Start';el.setAttribute('aria-label','Start daily board here');}
      if(g.hasModifier('fog')&&r!=null&&c!=null&&!g.isVisible(r,c)){
        el.classList.add('fogged');
        el.setAttribute('aria-label','Unrevealed, dimmed by fog');
      }
    }
  }

  boardHint(){
    const g=this.game;
    if(g.gameWon)return 'Board cleared. Every remaining covered tile is a mine.';
    if(g.gameOver&&!g.gameWon)return 'Board review: × marks an incorrect flag.'+(g.hitCell?' The red tile ended the run.':'');
    if(this.inputMode==='inspect')return g.firstClick?'Switch to Reveal to begin. Inspect reads clues without opening tiles.':'Select a clue to inspect its neighbors without revealing anything.';
    if(g.dailyDate&&g.firstClick)return 'Reveal the marked Start tile. The clock waits until you begin.';
    if(g.firstClick)return 'Choose a starting tile. Its neighbors are safe. The clock starts on reveal.';
    if(this.inputMode==='flag')return 'Select a tile to place or remove a flag. A flag is your estimate, not a confirmed mine.';
    return 'Reveal safe tiles. Right-click or F to flag. Inspect a number to check its neighbors.';
  }

  clearInspection(){
    document.querySelectorAll('#grid .inspect-source,#grid .inspect-neighbor').forEach(el=>el.classList.remove('inspect-source','inspect-neighbor'));
    const hint=document.getElementById('board-hint');if(hint)hint.textContent=this.boardHint();
  }

  inspectCell(r,c){
    if(this._paused)return;
    this.clearInspection();
    const g=this.game,cell=g.board[r]?.[c];
    const review=g.gameOver&&!g.gameWon;
    if(!cell||(!cell.revealed&&!review)||cell.mine)return;
    const hint=document.getElementById('board-hint');
    const grid=document.getElementById('grid');if(!hint||!grid)return;
    grid.children[r*g.cols+c]?.classList.add('inspect-source');
    if(cell.dead){hint.textContent='This tile was cleared by SPYWARE. Its clue is unavailable.';return;}
    if(!review&&g.hasModifier('cryptic')&&cell.adjacent>=4){hint.textContent='This clue is hidden by CORRUPT_DATA. Use surrounding clues; this tile cannot clear neighbors.';return;}
    let flags=0,covered=0;
    for(let dr=-1;dr<=1;dr++)for(let dc=-1;dc<=1;dc++){
      if(!dr&&!dc)continue;
      const nr=r+dr,nc=c+dc,neighbor=g.board[nr]?.[nc];if(!neighbor)continue;
      if(neighbor.flagged)flags++;
      else if(!neighbor.revealed)covered++;
      grid.children[nr*g.cols+nc]?.classList.add('inspect-neighbor');
    }
    const count=cell.adjacent;
    const detail=review?'Review your flags against the revealed board.':!covered?'No covered neighbors remain.':flags===count?'Reveal this number to clear unflagged neighbors. Wrong flags can hit a mine.':flags>count?'Too many flags. Check their positions.':'Match the clue with flags before clearing its neighbors.';
    hint.textContent=`${count} adjacent mine${count===1?'':'s'} · ${flags} flag${flags===1?'':'s'} · ${detail}`;
  }

  getCellEl(e){const el=e.target.closest('.cell');if(!el)return null;return{el,r:+el.dataset.r,c:+el.dataset.c};}

  handleClick(e){
    const t=this.getCellEl(e);if(!t||this.game.gameOver||this._paused)return;
    this.advanceClock();if(this.game.gameOver)return;
    if(this.game.dailyDate){
      if(this.game.firstClick){
        if(t.r!==DAILY_BOARD.startRow||t.c!==DAILY_BOARD.startCol){this.showToast('Begin at the marked Start tile.');return;}
        this._beginDailyAttempt();
      }
    }
    this._focusCell={r:t.r,c:t.c};
    sfx.init();
    const cell=this.game.board[t.r][t.c];
    if(this.game.firstClick)this.timerLastTick=Date.now();
    const wasChord=cell.revealed;
    if(wasChord)this.inspectCell(t.r,t.c);
    const results=wasChord?this.game.chord(t.r,t.c):this.game.reveal(t.r,t.c);
    if(!results.length)return;

    if(results[0]?.chordDisabled){
      sfx.chordFail();
      this.showToast('CHORD DISABLED','var(--danger)');
      t.el.classList.remove('chord-fail');void t.el.offsetWidth;
      t.el.classList.add('chord-fail');
      return;
    }

    if(this.game.consumeSurge())this.triggerSurge();

    const hit=results.find(result=>result.mine);
    if(hit){
      if(results[0]?.chordPenalty){sfx.chordFail();this.showToast('A flag was misplaced.');}
      if(this._cheats.invincible){
        const cell=this.game.board[hit.r][hit.c];
        cell.mine=false;cell.revealed=false;this.game.mineCount--;this.game.revealedCount--;this.game.gameOver=false;
        for(let r=0;r<this.game.rows;r++)for(let c=0;c<this.game.cols;c++)this.game.board[r][c].adjacent=this.game.countAdj(r,c);
        this.showToast('Mine removed in developer mode');this.renderBoard();return;
      }
      this.onMineHit(hit.r,hit.c);return;
    }
    if(results.some(result=>result.shieldBlocked)){sfx.shieldBlock();this.showToast('FIREWALL absorbed a mine.');}
    if(results.some(result=>result.scapegoatBlocked)){sfx.shieldBlock();this.showToast('BLOATWARE absorbed a mine. Time reduced.');}

    wasChord?sfx.chordSuccess():sfx.reveal();
    const now=Date.now();
    const comboWindow=this.game.dailyDate?0:this.game.gameClass==='samson'?1000:800;
    if(now-this.lastRevealTime<comboWindow){
      this.comboCount++;
      if(this.comboCount>=3){
        const bonus=this.game.gameClass==='samson'?Math.min(this.comboCount-1,7):Math.min(this.comboCount-2,5);
        this.game.awardShards(bonus);this.showCombo(e.clientX,e.clientY,this.comboCount);
      }
      if(this.game.gameClass==='samson'&&this.comboCount>=5){
        this.game.timeRemaining=Math.min(this.game.timeRemaining+1,this.game.maxTime+30);
        if(this.comboCount===5||this.comboCount%3===0)this.showToast('+1s','var(--accent)');
      }
      if(this.comboCount===4||this.comboCount===7){const line=NARRATOR.react('combo',{count:this.comboCount});if(line)this.setFlavor(line);}
      // Track max combo for class unlocks
      const prevMax=parseInt(localStorage.getItem('sweeper_maxCombo')||'0',10);
      if(this.comboCount>prevMax)localStorage.setItem('sweeper_maxCombo',String(this.comboCount));
    }else{this.comboCount=1;}
    this.lastRevealTime=now;

    this.renderBoard();
    const revealClass=wasChord?'chord-reveal':'just-revealed';
    results.forEach(({r,c})=>{
      if(r==null||c==null)return;
      const idx=r*this.game.cols+c;
      const cellEl=document.getElementById('grid')?.children[idx];
      if(cellEl)cellEl.classList.add(revealClass);
    });

    if(this.game.gameWon){this.stopTimer();sfx.levelComplete();this._queueResult(500);}
  }

  handleRightClick(e){
    const t=this.getCellEl(e);if(!t||this.game.gameOver||this._paused)return;
    this.advanceClock();if(this.game.gameOver)return;
    if(this.game.dailyDate&&this.game.firstClick){this.showToast('Reveal Start before placing flags.');return;}
    if(this.game.gameClass==='solomon'&&this.game.firstClick){this.showToast('Reveal a tile before placing Solomon flags.');return;}
    this._focusCell={r:t.r,c:t.c};
    const cell=this.game.board[t.r][t.c];
    sfx.init();const was=cell.flagged;
    if(this.game.toggleFlag(t.r,t.c)){
      if(this.game.gameClass==='solomon'&&!was&&!this.game.firstClick){
        if(cell.mine){
          if(!cell.flagRewarded){cell.flagRewarded=true;this.game.timeRemaining+=3;this.showToast('+3s','var(--accent)');}
          sfx.flag();
        }else{
          this.game.gameOver=true;this.game.gameWon=false;
          this.onMineHit(t.r,t.c,'wrongFlag');return;
        }
      }else{was?sfx.unflag():sfx.flag();}
      this.renderBoard();
    }
  }

  triggerSurge(){
    this.container.classList.remove('surge-flash');void this.container.offsetWidth;
    this.container.classList.add('surge-flash');
    this.showToast('Clock now runs 25% faster. Clues stay the same.','var(--danger)');
    sfx.explosion();
    setTimeout(()=>this.container.classList.remove('surge-flash'),900);
  }

  onMineHit(r,c,reason='mine'){
    this.game.lossReason=reason;this.game.hitCell={r,c};
    sfx.explosion();
    this.wrapper.classList.remove('shake');void this.wrapper.offsetWidth;
    this.wrapper.classList.add('shake');
    setTimeout(()=>this.wrapper.classList.remove('shake'),400);

    this.renderBoard();
    const idx=r*this.game.cols+c;
    const hitEl=document.getElementById('grid')?.children[idx];
    if(hitEl)hitEl.classList.add('mine-hit');

    this.setFlavor(NARRATOR.react('gameOver')||'');
    this.stopTimer();
    this._queueResult(900);
  }

  showCombo(x,y,count){
    const el=document.createElement('div');
    el.className='combo';el.textContent=`x${count}`;
    el.style.fontSize=(14+count*2)+'px';
    el.style.left=x+'px';el.style.top=y+'px';
    document.body.appendChild(el);
    setTimeout(()=>el.remove(),700);
  }

  showToast(msg,color){
    document.querySelectorAll('.toast-msg').forEach(el=>el.remove());
    const el=document.createElement('div');
    el.className='toast-msg';el.textContent=msg;
    el.setAttribute('role','status');
    el.style.color=color||'var(--accent)';
    document.body.appendChild(el);
    setTimeout(()=>el.remove(),2400);
  }

  showLevelComplete(){
    if(this.game.dailyDate){this.showDailyResult();return;}
    if(!this._runActive||!this.game.gameWon||document.getElementById('modal'))return;
    const g=this.game;this.stopTimer();
    const baseBonus=10*(g.level+1)+Math.floor(g.timeRemaining/5);
    const shardBonus=g.completionBonus??Math.floor(baseBonus*(g.gameClass==='manna'?2:1)*(g.bargainCurseTime>0?.5:1));
    const isLast=g.level>=g.totalDepths-1;
    const justUnlockedHard=isLast&&!g.hardMode&&localStorage.getItem('sweeper_hardUnlocked')!=='1';
    if(justUnlockedHard){localStorage.setItem('sweeper_beatNormal','1');localStorage.setItem('sweeper_hardUnlocked','1');}
    if(isLast)this._recordRun(true);
    const elapsed=this.levelStartTime?Math.floor((Date.now()-this.levelStartTime)/1000):60;
    this.setFlavor(NARRATOR.react('levelComplete',{level:g.level,elapsed})||'');

    let nextModsHTML='';
    if(!isLast&&g.hardMode){
      const preview=g._nextModifiers||rollModifiers(g.level+1);
      g._nextModifiers=preview;
      nextModsHTML=`<ul class="shop-modifiers">${preview.map(m=>`<li><strong>${m.name}</strong> ${m.desc}</li>`).join('')}</ul>`;
    }

    const shop=['timewarp','shield','compass','oracle','lantern'].map(id=>({id,...GAME_TOOLS[id]}));
    const cursedShop=['hex','bargain','scapegoat','pyre','tithe'].map(id=>({id,...GAME_TOOLS[id]}));
    let items;
    if(this._shopItems){items=this._shopItems;}
    else if(g.gameClass==='eden'){
      items=[...cursedShop].sort(()=>Math.random()-0.5).slice(0,3);
    }else{
      const pool=g.gameClass==='wraith'?shop.filter(p=>p.id!=='shield'):[...shop];
      if(Math.random()<0.3)pool.push(cursedShop[Math.floor(Math.random()*cursedShop.length)]);
      items=pool.sort(()=>Math.random()-0.5).slice(0,3);
    }
    this._shopItems=items;
    this._autosave();
    const lastTitle=g.hardMode?'SYSTEM CLEARED':'ALL SECTORS SWEPT';
    const lastFlavor=justUnlockedHard?'Four levels cleared. ROOT.ACCESS and two new modules are now available from the menu.':(g.hardMode?'All levels swept. Process complete. Session terminated cleanly.':'Four levels cleared. Process complete.');
    const carryTime=g.gameClass==='wraith'?0:Math.floor(g.timeRemaining*0.3);
    const loadoutHTML=()=>{
      const held=[...g.powerups];
      if(g.gameClass==='wraith'&&!held.includes('shield'))held.push('shield');
      const counts=held.reduce((all,id)=>({...all,[id]:(all[id]||0)+1}),{});
      const entries=Object.entries(counts);
      const tools=entries.map(([id,count])=>`<li><strong>${GAME_TOOLS[id].name}${id==='scapegoat'?' · '+g.scapegoatCharges+' hits':count>1?' × '+count:''}</strong><span>${GAME_TOOLS[id].desc}</span></li>`).join('');
      const curse=g.bargainCurseTime>0?`<p class="shop-effect">ADWARE remains active: half the keys for ${g.bargainCurseTime} more seconds.</p>`:'';
      const slowdown=g.gameClass==='eden'?`<p class="shop-effect">These held dependencies slow the clock by ${Math.round((1-g.edenSlowdown)*100)}%.</p>`:'';
      return `<summary tabindex="0">Your tools for level ${g.level+2} · ${entries.length?entries.length+' type'+(entries.length===1?'':'s'):'none yet'}</summary><ul>${tools||'<li>No tools installed. You can keep your keys for the next shop.</li>'}</ul>${g.gameClass==='wraith'?'<p class="shop-effect">lazarus.dll supplies a fresh FIREWALL for every level.</p>':''}${curse}${slowdown}`;
    };
    const itemStatus=p=>p.bought?'Ready for the next level':g.shards<p.price?`Need ${p.price-g.shards} more keys`:'Install for the next level';
    let html=`<div class="modal-overlay" id="modal"><div class="modal level-complete ${isLast?'':'shop-dialog'}">
      <h2>${isLast?lastTitle:'Level '+(g.level+1)+' cleared'}</h2>`;
    if(isLast){
      html+=`<div class="flavor">${lastFlavor}</div><div class="big-number">+${shardBonus}</div><div class="big-label">Keys recovered</div><button class="btn btn-primary" id="modal-action">Back to menu</button>`;
    }else{
      const next=LEVELS[g.level+1],extra=g.gameClass==='wraith'?1:0;
      const baseTime=g.gameClass==='samson'?Math.floor(next.time*.85):next.time;
      html+=`<div class="shop-reward"><span>+${shardBonus} keys recovered</span><strong id="shop-shards" aria-live="polite">${g.shards} keys available</strong></div>
        <section class="shop-next" aria-label="Next level">
          <div class="shop-next-heading"><strong>Level ${g.level+2} of ${g.totalDepths}</strong><span>${next.rows+extra} × ${next.cols+extra} · ${next.mines} mines</span></div>
          <p>Starting clock <strong>${this.fmtTime(baseTime+carryTime)}</strong> <span>${carryTime?`(${this.fmtTime(baseTime)} + ${carryTime}s carried)`:`(${g.gameClass==='wraith'?'no time carry with lazarus.dll':'no time carried'})`}</span></p>
          ${nextModsHTML}
        </section>
        <details class="shop-loadout" id="shop-loadout">${loadoutHTML()}</details>
        <div class="shop-header">Choose your tools</div>
        <p class="shop-note">Buy what helps your run, or save your keys. Unused tools carry forward.</p>
        <div class="shop-grid">
          ${items.map(p=>`<button type="button" class="shop-item ${p.cursed?'cursed':''} ${p.bought?'bought':g.shards<p.price?'cant-afford':''}" data-pick="${p.id}" data-price="${p.price}" ${p.bought||g.shards<p.price?'disabled':''} aria-disabled="${!!p.bought||g.shards<p.price}" aria-label="${p.bought?'Installed':'Install'} ${p.name}${p.bought?'':', '+p.price+' keys'}" aria-describedby="shop-desc-${p.id} shop-status-${p.id}">
            <span class="s-name">${p.name}${p.cursed?' <small>Trade-off</small>':''}</span>
            <span class="s-price" aria-hidden="true">${p.bought?'Installed':p.price+' keys'}</span><span class="s-desc" id="shop-desc-${p.id}">${GAME_TOOLS[p.id].desc}</span>
            <span class="shop-item-status" id="shop-status-${p.id}">${itemStatus(p)}</span>
          </button>`).join('')}
        </div>
        <div class="shop-actions"><button class="btn btn-primary shop-descend" id="shop-descend">Start level ${g.level+2}</button></div>`;
    }
    html+='</div></div>';
    const target=document.body.classList.contains('exe-mode')&&document.getElementById('exe-win-sweeper')||document.body;
    target.insertAdjacentHTML('beforeend',html);

    if(isLast){
      document.getElementById('modal-action').addEventListener('click',()=>{
        document.getElementById('modal').remove();
        writeStored('sweeper_autosave',null);this._runActive=false;this.showStart();
      });
    }else{
      const updateShop=()=>{
        document.getElementById('shop-shards').textContent=g.shards+' keys available';
        document.getElementById('shop-loadout').innerHTML=loadoutHTML();
        document.querySelectorAll('.shop-item').forEach(el=>{
          const item=items.find(p=>p.id===el.dataset.pick);
          const unavailable=!!item.bought||g.shards<item.price;
          el.classList.toggle('bought',!!item.bought);
          el.classList.toggle('cant-afford',!item.bought&&g.shards<item.price);
          el.disabled=unavailable;el.setAttribute('aria-disabled',String(unavailable));
          el.setAttribute('aria-label',item.bought?'Installed '+item.name:`Install ${item.name}, ${item.price} keys`);
          el.querySelector('.s-price').textContent=item.bought?'Installed':item.price+' keys';
          el.querySelector('.shop-item-status').textContent=itemStatus(item);
        });
      };
      document.querySelectorAll('.shop-item').forEach(el=>{
        el.addEventListener('click',()=>{
          const item=items.find(p=>p.id===el.dataset.pick);
          if(item.bought||g.shards<item.price)return;
          g.shards-=item.price;sfx.purchase();
          g.powerups.push(item.id);
          if(item.id==='scapegoat')g.scapegoatCharges+=2;
          item.bought=true;
          this._autosave();sfx.powerup();
          if(item.cursed){const line=NARRATOR.react('boughtCursed');if(line)this.setFlavor(line);}
          else if(item.id==='shield'){const line=NARRATOR.react('boughtWard');if(line)this.setFlavor(line);}
          updateShop();
          (document.querySelector('.shop-item:not(:disabled)')||document.getElementById('shop-descend')).focus({preventScroll:true});
        });
      });
      document.getElementById('shop-descend').addEventListener('click',()=>{
        g.level++;g.initLevel();
        if(g._nextModifiers){g.modifiers=g._nextModifiers;g._nextModifiers=null;}
        if(carryTime>0){g.timeRemaining+=carryTime;g.maxTime+=carryTime;}
        document.getElementById('modal').remove();
        this.startLevel();
      });
    }
    this._focusResult(isLast?'#modal-action':document.querySelector('.shop-item:not(:disabled)')?'.shop-item:not(:disabled)':'#shop-descend');
  }

  showGameOver(){
    if(this.game.dailyDate){this.showDailyResult();return;}
    if(!this._runActive||!this.game.gameOver||this.game.gameWon||document.getElementById('modal'))return;
    const alreadyRecorded=this._recorded;
    this._recordRun(false);this._autosave();sfx.gameOver();
    const g=this.game;
    // Increment session count on failed run
    const s=parseInt(localStorage.getItem('sweeper_sessions')||'47',10)+1;
    if(!alreadyRecorded)localStorage.setItem('sweeper_sessions',String(s));
    const _mt=document.body.classList.contains('exe-mode')&&document.getElementById('exe-win-sweeper')||document.body;
    _mt.insertAdjacentHTML('beforeend',`
      <div class="modal-overlay" id="modal"><div class="modal game-over">
        <h2>Run over</h2>
        <div class="flavor">${g.timeRemaining<=0?'Time ran out.':g.lossReason==='wrongFlag'?'A flag was placed on a safe tile.':'A mine ended this run.'}</div>
        <div class="go-body">
          <div class="go-stat"><span class="go-k">Level</span><span class="go-v">${g.level+1} of ${g.totalDepths}</span></div>
          <div class="go-stat"><span class="go-k">Keys</span><span class="go-v">${g.shards}</span></div>
          <div class="go-stat"><span class="go-k">Safe tiles</span><span class="go-v">${g.board.flat().filter(c=>c.revealed&&!c.mine).length} / ${g.rows*g.cols-g.mineCount}</span></div>
        </div>
        <div class="go-actions"><button class="btn" id="game-review">Review board</button><button class="btn" id="game-menu">Menu</button><button class="btn btn-primary" id="modal-action">Try again</button></div>
      </div></div>`);
    document.getElementById('modal-action').addEventListener('click',()=>this._newRun());
    document.getElementById('game-menu').addEventListener('click',()=>{this._runActive=false;this.showStart();});
    document.getElementById('game-review').addEventListener('click',()=>this.renderBoard());
    this._focusResult('#modal-action');
  }

  usePowerup(type){
    sfx.init();if(this.game.gameOver||this._paused)return;
    this.advanceClock();if(this.game.gameOver)return;
    if(this.game.firstClick&&['compass','oracle','lantern','hex','tithe','pyre'].includes(type)){this.showToast('Reveal a tile first.');return;}
    if(type==='timewarp'){
      const before=this.game.timeRemaining;
      if(this.game.useTimeWarp()){sfx.powerup();this.showToast('+'+(this.game.timeRemaining-before)+'s','var(--accent)');this.renderBoard();}
      else this.showToast('Clock is full. BACKUP kept for later.');
    }else if(type==='compass'){
      const flagged=this.game.useCompass();
      if(flagged){sfx.powerup();this.showToast(flagged+' marked','var(--num-4)');this.renderBoard();}
    }else if(type==='oracle'){
      const result=this.game.useOracle();
      if(result){sfx.powerup();this.showToast(result.revealed.length+' safe / '+result.flagged.length+' marked','var(--num-6)');this.renderBoard();
        result.revealed.forEach(({r,c})=>{const idx=r*this.game.cols+c;const el=document.getElementById('grid')?.children[idx];if(el)el.classList.add('just-revealed');});
        if(this.game.gameWon){this.stopTimer();sfx.levelComplete();this._queueResult(400);}
      }
    }else if(type==='lantern'){
      const result=this.game.useLantern();
      if(result.status==='ok'&&result.revealed?.length){
        sfx.powerup();this.showToast('LANTERN LIT','#C8A878');this.renderBoard();
        result.revealed.forEach(({r,c})=>{const idx=r*this.game.cols+c;const el=document.getElementById('grid')?.children[idx];if(el)el.classList.add('just-revealed');});
        if(this.game.gameWon){this.stopTimer();sfx.levelComplete();this._queueResult(400);}
      }else{this.showToast('NO GOOD MARKS','var(--text-dim)');}
    }else if(type==='hex'){
      const results=this.game.useHex();
      if(results){sfx.powerup();this.showToast(results.length+' dead tiles revealed','var(--danger)');this.renderBoard();
        results.forEach(({r,c})=>{const idx=r*this.game.cols+c;const el=document.getElementById('grid')?.children[idx];if(el)el.classList.add('just-revealed');});
        if(this.game.gameWon){this.stopTimer();sfx.levelComplete();this._queueResult(400);}
      }
    }else if(type==='tithe'){
      const result=this.game.useTithe();
      if(result){sfx.powerup();this.showToast(result.added+' MARKED / '+result.removed+' WIPED / -20s','var(--danger)');this.renderBoard();
        if(this.game.timeRemaining<=0){this.game.gameOver=true;this.game.gameWon=false;this.stopTimer();sfx.gameOver();this._queueResult(600);}
      }
    }else if(type==='bargain'){
      const before=this.game.timeRemaining;
      if(this.game.useBargain()){sfx.powerup();this.showToast('+'+(this.game.timeRemaining-before)+'s / half keys for 60s','var(--danger)');this.renderBoard();}
      else this.showToast('Clock is full. ADWARE kept for later.');
    }else if(type==='pyre'){
      const result=this.game.usePyre();
      if(result.status==='badFlag'){
        sfx.explosion();this.onMineHit(result.r,result.c,'wrongFlag');
      }else if(result.status==='ok'&&result.revealed?.length){
        sfx.powerup();this.showToast('PYRE BURNS','var(--danger)');this.renderBoard();
        result.revealed.forEach(({r,c})=>{const idx=r*this.game.cols+c;const el=document.getElementById('grid')?.children[idx];if(el)el.classList.add('just-revealed');});
        if(this.game.gameWon){this.stopTimer();sfx.levelComplete();this._queueResult(400);}
      }else{this.showToast('NO MARKS','var(--text-dim)');}
    }else if(type==='scapegoat'){
      this.showToast('Passive — '+this.game.scapegoatCharges+' charge'+(this.game.scapegoatCharges===1?'':'s'),'var(--danger)');
    }
    if(type==='shield')this.showToast('FIREWALL protects you automatically.');
    if(this.game.consumeSurge())this.triggerSurge();
    this._autosave();
  }

  startTimer(){
    this.stopTimer();
    if(this._paused||!this._runActive||this.game.gameOver)return;
    this.timerLastTick=Date.now();
    this.timerInterval=setInterval(()=>this.advanceClock(),250);
  }

  advanceClock(){
    if(!this.timerInterval||this._paused||!this._runActive||this.game.gameOver)return;
    const now=Date.now();
    if(this.game.firstClick){this.timerLastTick=now;return;}
    const milliseconds=Math.max(0,now-this.timerLastTick)+this.game._clockRemainder;
    this.timerLastTick=now;
    this.game._clockRemainder=milliseconds%1000;
    const elapsed=Math.floor(milliseconds/1000);
    if(elapsed<1)return;
    for(let i=0;i<elapsed;i++){this.game.tick();if(this.game.gameOver)break;}
    const tv=document.getElementById('timer-val');
    const tb=document.getElementById('timer-bar');
    const mv=document.getElementById('mines-val');
    const isLow=this.game.timeRemaining<=15;

    if(tv){tv.textContent=this.fmtTime(this.game.timeRemaining);tv.className=`status-value ${isLow?'danger-text':'accent'}`;if(isLow)sfx.tick();}
    if(tb){const pct=this.game.maxTime>0?(this.game.timeRemaining/this.game.maxTime*100):0;tb.style.width=pct+'%';tb.className=`timer-bar ${isLow?'low':''}`;}
    if(mv)mv.textContent=this.game.mineCount-this.game.flagCount;
    const shv=document.getElementById('shard-val');if(shv)shv.textContent=this.game.dailyDate?this.game.board.flat().filter(c=>c.revealed&&!c.mine).length:this.game.shards;

    if(this.game.timeRemaining%5===0)this._autosave();
    this.container.classList.toggle('danger',isLow&&!this.game.gameOver);
    if(isLow&&!this.dangerFlavorShown){this.dangerFlavorShown=true;this.setFlavor(randomFlavor('danger'));}

    if(this.game.gameOver&&!this.game.gameWon){
      this.setFlavor(NARRATOR.react('gameOver')||'');
      this.stopTimer();sfx.gameOver();this._queueResult(600);
    }
  }

  stopTimer(){if(this.timerInterval){clearInterval(this.timerInterval);this.timerInterval=null;}}
  fmtTime(s){const m=Math.floor(s/60);return`${String(m).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`;}

  saveGame(){
    if(this.game.dailyDate){this.showToast('Daily progress saves automatically.');return;}
    this.advanceClock();
    if(!this._runActive||this.game.gameOver)return;
    const saved=readStored('sweeper_saves',{});
    const saves=saved&&typeof saved==='object'&&!Array.isArray(saved)?saved:{};
    const name=`RUN_${Date.now()}.SAV`;
    saves[name]=this._snapshot();
    if(writeStored('sweeper_saves',saves)){sfx.diskWrite();this.showToast('Run saved in this browser.');}
    else this.showToast('Could not save. Browser storage is full or unavailable.');
  }

  loadGame(){
    this.pauseGame();
    const saved=readStored('sweeper_saves',{});
    const entries=Object.entries(saved&&typeof saved==='object'&&!Array.isArray(saved)?saved:{}).reverse();
    const win=this._renderWin('savedgames',`<div class="exe-titlebar"><div class="exe-ttext">Saved games</div><div class="exe-tbtns"><button class="exe-tbtn exe-close-btn" aria-label="Close saved games">&times;</button></div></div><div class="exe-save-list">${entries.length?entries.map(([name,s],i)=>`<div class="exe-save-row"><div><strong>${this._validSave(s)?`Level ${s.level+1} · ${escapeHTML(classById(s.gameClass).name)}`:escapeHTML(name)}</strong><small>${this._validSave(s)?`${s.shards} keys · ${this.fmtTime(s.timeRemaining)} remaining`:'Save unavailable'}</small><small>${s?.savedAt?escapeHTML(new Date(s.savedAt).toLocaleString()):'Earlier save'}</small></div><div class="exe-control-group"><button class="exe-btn" data-load="${i}" ${this._validSave(s)?'':'disabled'}>Load</button><button class="exe-btn" data-delete="${i}" aria-label="Delete save ${i+1}">Delete</button></div></div>`).join(''):'<p>No manual saves yet. Use Save during a run to keep a separate copy.</p>'}<p class="exe-launch-note">Saves are stored on this browser and device.</p></div>`);
    win.querySelectorAll('[data-load]').forEach(b=>b.addEventListener('click',()=>this._loadSaveFile(entries[+b.dataset.load][0])));
    win.querySelectorAll('[data-delete]').forEach(b=>b.addEventListener('click',()=>{
      const name=entries[+b.dataset.delete][0];
      this._confirm('Delete this save?','This removes the manual save. Your current run and automatic save are kept.',()=>{delete saved[name];if(writeStored('sweeper_saves',saved))this.loadGame();else this.showToast('Could not delete this save.');});
    }));
  }

  _loadSaveFile(name){
    const saves=readStored('sweeper_saves',{});const saved=saves?.[name];
    if(!this._validSave(saved)){this.showToast('This save cannot be opened.');return;}
    const load=()=>this._restoreSave(saved);
    if(this._runActive&&!this.game.gameOver)this._confirm('Load this saved run?','Your current run will be replaced. Manual saves stay available.',load);else load();
  }

}

const ui=new GameUI();
</script>
