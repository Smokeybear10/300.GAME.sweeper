function classById(id){return CLASSES.find(c=>c.id===id)||CLASSES[0];}
function isClassUnlocked(id){
  if(id==='eden'||id==='manna')return localStorage.getItem('sweeper_hardUnlocked')==='1';
  return true;
}

// LAYER MODIFIERS (ROOT.ACCESS only)
// ============================================================
const MODIFIERS=[
  {id:'fog',name:'LOW_MEMORY',desc:'Distant tiles are dimmed. You can still reveal or flag them.',icon:'&#x2601;'},
  {id:'cryptic',name:'CORRUPT_DATA',desc:'Clues of 4 or more are hidden. These tiles cannot clear neighbors.',icon:'&#x2753;'},
  {id:'echo',name:'MEMORY_LEAK',desc:'Clues fade over 10 seconds. Hover, focus, or Inspect to read them.',icon:'&#x2620;'},
  {id:'surge',name:'STACK_OVERFLOW',desc:'After half the safe tiles are cleared, the clock runs 25% faster.',icon:'&#x2623;'},
];
// Hard mode: D1-D3 = 1 modifier, D4-D5 = 2 modifiers stacked
function rollModifiers(level){
  const count=level>=3?2:1;
  const pool=[...MODIFIERS];
  const picked=[];
  for(let i=0;i<count&&pool.length;i++){
    const idx=Math.floor(Math.random()*pool.length);
    picked.push(pool.splice(idx,1)[0]);
  }
  return picked;
}

class GameUI{

    this.effects=readStored('sweeper_effects',!matchMedia('(prefers-reduced-motion: reduce)').matches)!==false;
    document.body.classList.toggle('effects-off',!this.effects);
    this._ensureShell();this.showStart();
    document.addEventListener('visibilitychange',()=>{if(document.hidden)this.pauseGame();});

      clearTimeout(this._resizeTimer);
      this._resizeTimer=setTimeout(()=>{if(this._runActive&&!document.getElementById('modal'))this.renderBoard();},120);
    });
    document.addEventListener('keydown',e=>{
      if(e.key==='Escape'&&this._runActive&&!this.game.gameOver&&!document.querySelector('#exe-win-confirm,#exe-win-savedgames,#exe-win-lesson')){
        e.preventDefault();this._paused?this.resumeGame():this.pauseGame();
      }

  _newRun(){
    this.stopTimer();this._closeWin('savedgames');this._closeWin('lore');this._closeWin('lesson');
    this._recorded=false;this._shopItems=null;this._runStartedAt=Date.now();this._focusCell={r:0,c:0};
    if(this.game.dailyDate&&this._regularOptions){this.game.gameClass=this._regularOptions.gameClass;this.game.hardMode=this._regularOptions.hardMode;}
    this.game.dailyDate=null;this.game.dailyAttempt=0;this._setDailyURL(null);
    this.game.reset();this._runActive=true;this._paused=false;this.startLevel();
  }

  _dailyStats(date){
    const value=readStored('sweeper_daily_v1_'+date,{});
    const valid=r=>r&&typeof r.won==='boolean'&&Number.isInteger(r.seconds)&&r.seconds>=0&&r.seconds<=DAILY_BOARD.time&&Number.isInteger(r.cleared)&&r.cleared>=0&&r.cleared<=119&&Number.isInteger(r.attempt)&&r.attempt>0;
    return {attempts:Number.isSafeInteger(value?.attempts)&&value.attempts>=0?value.attempts:0,
      first:valid(value?.first)?value.first:null,best:valid(value?.best)?value.best:null,last:valid(value?.last)?value.last:null};
  }

  _setDailyURL(date){
    const url=new URL(location.href);
    if(date){url.searchParams.set('daily',date);url.searchParams.set('v',DAILY_BOARD.version);}
    else{url.searchParams.delete('daily');url.searchParams.delete('v');}
    history.replaceState(null,'',url.pathname+url.search+url.hash);
  }

  _dailyLink(date){
    const url=new URL(location.pathname,location.origin);
    url.searchParams.set('daily',date);url.searchParams.set('v',DAILY_BOARD.version);
    return url.href;
  }

  _startDaily(date){
    if(!sweeperDailyDate(date))return;
    this.pauseGame();this._autosave();
    if(!this.game.dailyDate)this._regularOptions={gameClass:this.game.gameClass,hardMode:this.game.hardMode};
    this.stopTimer();this._closeWin('savedgames');this._closeWin('lore');this._closeWin('lesson');
    const g=new Game();g.dailyDate=date;g.reset();this.game=g;
    this._recorded=false;this._runStartedAt=Date.now();this._cheats={mines:false,invincible:false,infTime:false};
    this._setDailyURL(date);this.startLevel();
  }

  _openDaily(date){
    const saved=readStored('sweeper_daily_autosave',null);
    if(this._validSave(saved)&&saved.dailyDate===date){this._restoreSave(saved);return;}
    if(this._validSave(saved)&&saved.dailyDate&&!saved.gameOver&&!saved.firstClick){
      this._confirm('Replace the paused daily board?',`Your ${saved.dailyDate} daily board is still in progress. Starting this board replaces its autosave. Your ordinary run stays saved.`,()=>this._startDaily(date));return;
    }
    this._startDaily(date);
  }

  _beginDailyAttempt(){
    const g=this.game;if(!g.dailyDate||g.dailyAttempt)return;
    const stats=this._dailyStats(g.dailyDate);
    g.dailyAttempt=stats.attempts+1;stats.attempts=g.dailyAttempt;
    if(!writeStored('sweeper_daily_v1_'+g.dailyDate,stats))this.showToast('Browser storage unavailable. This attempt cannot be kept.');
  }

  _recordDaily(){
    const g=this.game;if(this._recorded||!g.dailyDate||!g.gameOver)return;
    const result={won:g.gameWon,seconds:Math.min(180,180-g.timeRemaining+(g._clockRemainder>0?1:0)),cleared:g.board.flat().filter(c=>c.revealed&&!c.mine).length,attempt:g.dailyAttempt};
    const stats=this._dailyStats(g.dailyDate);
    if(result.attempt===1&&!stats.first)stats.first=result;
    if(result.won&&(!stats.best||result.seconds<stats.best.seconds))stats.best=result;
    stats.attempts=Math.max(stats.attempts,g.dailyAttempt);stats.last=result;
    if(!writeStored('sweeper_daily_v1_'+g.dailyDate,stats))this.showToast('Could not save this result in your browser.');
    this._recorded=true;
  }

  _dailyShareText(){
    const g=this.game;
    const seconds=Math.min(180,180-g.timeRemaining+(g._clockRemainder>0?1:0));
    const cleared=g.board.flat().filter(c=>c.revealed&&!c.mine).length;
    return `SWEEPER.EXE · Daily ${g.dailyDate}\n${g.gameWon?'Cleared':'Not cleared'} · ${cleared}/119 safe tiles · ${this.fmtTime(seconds)} active time\n${g.dailyAttempt===1?'First attempt':'Practice · attempt '+g.dailyAttempt}\n${this._dailyLink(g.dailyDate)}`;
  }

  async _copyDaily(text,button){
    try{
      if(!navigator.clipboard?.writeText)throw new Error('Clipboard unavailable');
      await navigator.clipboard.writeText(text);
      button.textContent='Copied';
    }catch{
      this.pauseGame();
      const win=this._renderWin('share',`<div class="exe-titlebar"><div class="exe-ttext">Copy daily board</div><div class="exe-tbtns"><button class="exe-tbtn exe-close-btn" aria-label="Close">&times;</button></div></div><div class="exe-dialog-content"><p>Copy the selected text below.</p><textarea id="daily-copy-text" rows="6" readonly aria-label="Share text"></textarea></div>`);
      const area=win.querySelector('textarea');area.value=text;area.focus();area.select();
    }
  }

  _focusResult(selector){
    const overlay=document.getElementById('modal');
    const dialog=overlay?.querySelector('.modal');if(!dialog)return;
    clearTimeout(this._resultTimer);this._resultTimer=null;
    dialog.setAttribute('role','dialog');dialog.setAttribute('aria-modal','true');
    const title=dialog.querySelector('h2');title.id='result-title';dialog.setAttribute('aria-labelledby',title.id);
    for(const sibling of overlay.parentElement.children){if(sibling!==overlay)sibling.inert=true;}
    const controls=()=>[...dialog.querySelectorAll('button:not(:disabled),[tabindex="0"]')].filter(el=>el.getClientRects().length);
    overlay.addEventListener('keydown',e=>{
      if(e.key!=='Tab')return;
      const items=controls(),first=items[0],last=items.at(-1);
      if(e.shiftKey&&document.activeElement===first){e.preventDefault();last?.focus();}
      else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first?.focus();}
    });
    (dialog.querySelector(selector)||controls()[0])?.focus({preventScroll:true});
  }

  _queueResult(delay){
    const game=this.game;
    clearTimeout(this._resultTimer);
    this._resultTimer=setTimeout(()=>{
      this._resultTimer=null;
      if(this.game!==game||!game.gameOver||!this._runActive||!document.getElementById('exe-win-sweeper'))return;
      game.gameWon?this.showLevelComplete():this.showGameOver();
    },delay);
  }

  showDailyResult(){
    const g=this.game;
    if(!this._runActive||!g.dailyDate||!g.gameOver||document.getElementById('modal')||!document.getElementById('exe-win-sweeper'))return;
    this.stopTimer();this._recordDaily();this._autosave();
    const seconds=Math.min(180,180-g.timeRemaining+(g._clockRemainder>0?1:0));
    const cleared=g.board.flat().filter(c=>c.revealed&&!c.mine).length;
    const status=g.dailyAttempt===1?'First attempt':'Practice · attempt '+g.dailyAttempt;
    document.getElementById('exe-win-sweeper').insertAdjacentHTML('beforeend',`
      <div class="modal-overlay" id="modal"><div class="modal daily-result">

        <div class="go-body"><div class="go-stat"><span class="go-k">Safe tiles</span><span class="go-v">${cleared} / 119</span></div><div class="go-stat"><span class="go-k">Active time</span><span class="go-v">${this.fmtTime(seconds)}</span></div></div>
        <p class="daily-result-note">${g.gameWon?'Every safe tile cleared.':g.timeRemaining<=0?'The clock ran out.':'A mine ended this attempt.'} ${g.dailyAttempt>1?'Your first result stays unchanged.':'Results stay in this browser.'}</p>
        <div class="go-actions"><button class="btn btn-primary" id="daily-copy-result">Copy result</button><button class="btn" id="daily-review">Review board</button><button class="btn" id="daily-replay">Replay</button><button class="btn" id="daily-menu">Menu</button></div>
      </div></div>`);
    document.getElementById('daily-copy-result').addEventListener('click',e=>this._copyDaily(this._dailyShareText(),e.currentTarget));
    document.getElementById('daily-review').addEventListener('click',()=>this.renderBoard());
    document.getElementById('daily-replay').addEventListener('click',()=>this._startDaily(g.dailyDate));
    document.getElementById('daily-menu').addEventListener('click',()=>this.showStart());
    this._focusResult('#daily-copy-result');
  }

  _validSave(s){
    if(!s||typeof s!=='object'||!Number.isInteger(s.level)||s.level<0||s.level>=LEVELS.length)return false;
    if(!CLASSES.some(c=>c.id===(s.gameClass||'sweeper')))return false;
    for(const key of ['firstClick','hardMode','gameOver','gameWon','surged','pendingSurge','shieldUsed','aegisCursed']){
      if(s[key]!==undefined&&typeof s[key]!=='boolean')return false;
    }
    if(typeof s.firstClick!=='boolean'||(s.level===4&&!s.hardMode))return false;
    if(s.dailyDate!=null&&(!sweeperDailyDate(s.dailyDate)||s.dailyVersion!==DAILY_BOARD.version||s.level!==0||s.gameClass!=='sweeper'||s.hardMode!==false||s.maxTime!==180||s.timeRemaining>180||!Number.isInteger(s.dailyAttempt)||s.dailyAttempt<0||(!s.firstClick&&s.dailyAttempt===0)||s.powerups?.length||s.modifiers?.length))return false;
    const cfg=s.dailyDate?DAILY_BOARD:LEVELS[s.level],extra=s.gameClass==='wraith'?1:0;
    if(s.rows!==cfg.rows+extra||s.cols!==cfg.cols+extra)return false;
    if(!Number.isSafeInteger(s.timeRemaining)||s.timeRemaining<0||!Number.isSafeInteger(s.maxTime)||s.maxTime<=0)return false;
    if(!Number.isSafeInteger(s.shards)||s.shards<0||!Array.isArray(s.board)||s.board.length!==s.rows)return false;
    if(!s.board.every(row=>Array.isArray(row)&&row.length===s.cols&&row.every(c=>c&&['mine','revealed','flagged'].every(k=>typeof c[k]==='boolean'))))return false;
    if(s.dailyDate){
      if(s.timeMultiplier!==1||s.board.flat().some(c=>c.dead)||s.firstClick&&(s.dailyAttempt!==0||s.board.flat().some(c=>c.flagged)))return false;
      if(!s.firstClick&&s.board.flat().filter(c=>c.mine).length!==DAILY_BOARD.mines)return false;
    }
    for(const row of s.board)for(const c of row){if(c.dead!==undefined&&typeof c.dead!=='boolean')return false;if(c.flagRewarded!==undefined&&typeof c.flagRewarded!=='boolean')return false;}
    for(const key of ['_tickAccum','_fracShards'])if(s[key]!==undefined&&(!Number.isFinite(s[key])||s[key]<0||s[key]>=1))return false;
    if(s._clockRemainder!==undefined&&(!Number.isFinite(s._clockRemainder)||s._clockRemainder<0||s._clockRemainder>=1000))return false;
    if(s._mannaTick!==undefined&&(!Number.isInteger(s._mannaTick)||s._mannaTick<0||s._mannaTick>=5))return false;
    for(const key of ['bargainCurseTime','scapegoatCharges','chordLockRemaining'])if(s[key]!==undefined&&(!Number.isFinite(s[key])||s[key]<0))return false;
    if(s.completionBonus!=null&&(!Number.isInteger(s.completionBonus)||s.completionBonus<0))return false;
    if(s.timeMultiplier!==undefined&&(!Number.isFinite(s.timeMultiplier)||s.timeMultiplier<=0))return false;
    if(s.powerups!==undefined&&(!Array.isArray(s.powerups)||!s.powerups.every(id=>Object.hasOwn(GAME_TOOLS,id))))return false;
    if(s.modifiers!==undefined&&(!Array.isArray(s.modifiers)||!s.modifiers.every(id=>MODIFIERS.some(m=>m.id===id))))return false;
    if(s._nextModifiers!=null&&(!Array.isArray(s._nextModifiers)||!s._nextModifiers.every(m=>MODIFIERS.some(known=>known.id===m?.id))))return false;
    if(s.firstClick&&s.board.flat().some(c=>c.mine||c.revealed))return false;
    if(s.gameWon&&(!s.gameOver||s.board.flat().some(c=>!c.mine&&!c.revealed)))return false;
    return !s.gameOver||s.gameWon===true||!!s.dailyDate;
  }

  _snapshot(){
    const g=this.game;
    return {...g,version:2,dailyVersion:g.dailyDate?DAILY_BOARD.version:null,savedAt:Date.now(),startedAt:this._runStartedAt,recorded:this._recorded===true,
      modifiers:g.modifiers.map(m=>m.id),board:g.board.map(row=>row.map(c=>({...c,...(g.hasModifier('echo')&&Number.isFinite(c.revealedAt)&&this._paused?{revealedAt:c.revealedAt+Date.now()-this._pausedAt}:{})}))),
      chordLockRemaining:Math.max(0,g.chordDisabledUntil-(this._paused?this._pausedAt:Date.now())),
      shopItems:this._shopItems?.map(p=>({id:p.id,bought:p.bought===true}))||null};
  }

  _autosave(){
    if(!this._runActive)return;
    const g=this.game;
    if(g.dailyDate){
      if(g.gameOver)this._recordDaily();
      const ok=writeStored('sweeper_daily_autosave',this._snapshot());
      if(!ok&&!this._storageWarning){this._storageWarning=true;this.showToast('Browser storage unavailable. Keep this tab open.');}
      return;
    }
    if(g.gameOver&&!g.gameWon){writeStored('sweeper_autosave',null);return;}
    const ok=writeStored('sweeper_autosave',this._snapshot());
    if(!ok&&!this._storageWarning){this._storageWarning=true;this.showToast('Browser storage unavailable. Keep this tab open.');}
  }

  _restoreSave(s){
    if(!this._validSave(s)){this.showToast('This save cannot be opened. Start a new run.');return;}
    if(s.dailyDate&&!this.game.dailyDate)this._regularOptions={gameClass:this.game.gameClass,hardMode:this.game.hardMode};
    this.stopTimer();this._closeWin('savedgames');this._closeWin('mycomp');this._closeWin('confirm');this._closeWin('lore');this._closeWin('lesson');
    const g=new Game();
    for(const key of Object.keys(g)){if(Object.hasOwn(s,key)&&!['board','modifiers','chordDisabledUntil'].includes(key))g[key]=s[key];}
    g.board=s.board.map(row=>row.map(c=>({...c})));g.modifiers=(s.modifiers||[]).map(id=>MODIFIERS.find(m=>m.id===id)).filter(Boolean);
    g.chordDisabledUntil=Date.now()+Math.max(0,Number(s.chordLockRemaining)||0);
    g.totalDepths=g.dailyDate?1:g.hardMode?5:4;
    if(g.dailyDate){this._cheats={mines:false,invincible:false,infTime:false};this._setDailyURL(g.dailyDate);}
    if(g.surged&&g.hasModifier('surge'))g.timeMultiplier=1.25;
    if(g.hasModifier('echo'))for(const row of g.board)for(const cell of row){
      if(Number.isFinite(cell.revealedAt))cell.revealedAt+=Math.max(0,Date.now()-(s.savedAt||Date.now()));
    }
    g.mineCount=g.firstClick?(g.dailyDate?DAILY_BOARD:LEVELS[g.level]).mines:g.board.flat().filter(c=>c.mine).length;
    g.revealedCount=g.board.flat().filter(c=>c.revealed&&!c.mine).length;
    for(let r=0;r<g.rows;r++)for(let c=0;c<g.cols;c++)g.board[r][c].adjacent=g.board[r][c].mine?0:g.countAdj(r,c);
    this.game=g;this._runActive=true;this._paused=false;this._focusCell={r:0,c:0};
    if(g.dailyDate&&g.firstClick)this._focusCell={r:DAILY_BOARD.startRow,c:DAILY_BOARD.startCol};
    this._runStartedAt=Number.isFinite(s.startedAt)?s.startedAt:Date.now();this._recorded=s.recorded===true;
    this._shopItems=Array.isArray(s.shopItems)?s.shopItems.filter(p=>p&&Object.hasOwn(GAME_TOOLS,p.id)).map(p=>({...GAME_TOOLS[p.id],id:p.id,bought:p.bought===true})):null;
    g._nextModifiers=Array.isArray(s._nextModifiers)?s._nextModifiers.map(m=>MODIFIERS.find(known=>known.id===m.id)).filter(Boolean):null;
    this.comboCount=0;this.lastRevealTime=0;this.levelStartTime=Date.now();
    this.renderBoard();
    if(g.dailyDate&&g.firstClick)document.querySelector('#grid .daily-start')?.focus({preventScroll:true});
    if(g.dailyDate&&g.gameOver)this.showDailyResult();else if(g.gameWon)this.showLevelComplete();else if(g.timeRemaining<=0){g.gameOver=true;this.showGameOver();}else this.startTimer();
  }

  pauseGame(){
    if(!this._runActive||this._paused||this.game.gameOver)return;
    this.advanceClock();
    if(this.game.gameOver)return;
    this._pausedAt=Date.now();this._paused=true;this.stopTimer();this._autosave();this.renderBoard();
  }

  resumeGame(){
    if(!this._runActive||!this._paused||this.game.gameOver)return;
    const elapsed=Date.now()-this._pausedAt;
    if(this.game.chordDisabledUntil>this._pausedAt)this.game.chordDisabledUntil+=elapsed;
    if(this.game.hasModifier('echo'))for(const row of this.game.board)for(const cell of row){if(Number.isFinite(cell.revealedAt))cell.revealedAt+=elapsed;}
    this.levelStartTime+=elapsed;this._paused=false;this.renderBoard();this.startTimer();
  }

  _confirm(title,body,action){
    this.pauseGame();this._confirmAction=action;
    const win=this._renderWin('confirm',`<div class="exe-titlebar"><div class="exe-ttext">${title}</div><div class="exe-tbtns"><button class="exe-tbtn exe-close-btn" aria-label="Cancel">&times;</button></div></div><div class="exe-dialog-content">${body}</div><div class="exe-dialog-actions"><button class="exe-btn" id="confirm-cancel">Cancel</button><button class="exe-btn default" id="confirm-yes">Continue</button></div>`);
    win.setAttribute('role','dialog');win.setAttribute('aria-label',title);
    win.querySelector('#confirm-cancel').addEventListener('click',()=>this._closeWin('confirm'));
    win.querySelector('#confirm-yes').addEventListener('click',()=>{const run=this._confirmAction;this._closeWin('confirm');run?.();});
    win.querySelector('#confirm-cancel').focus();
  }

  _recordRun(won){
    if(this.game.dailyDate){this._recordDaily();return;}
    if(this._recorded)return;
    this._recorded=true;
    const history=readStored('sweeper_history',[]);
    writeStored('sweeper_history',[{date:Date.now(),won,level:this.game.level+1,keys:this.game.shards,module:this.game.gameClass},...(Array.isArray(history)?history:[])].slice(0,100));
  }

  _bindCheatCodes(){
    document.addEventListener('keydown',e=>{
      if(this._runActive&&this.game.dailyDate)return;
      if(localStorage.getItem('sweeper_cheatsUnlocked')!=='1')return;
      if(!e.ctrlKey&&!e.metaKey)return;
      const k=e.key.toLowerCase();
      if(k==='m'){e.preventDefault();
        this._cheats.mines=!this._cheats.mines;
        this.showToast(this._cheats.mines?'MINES VISIBLE':'MINES HIDDEN','#888');
        this.renderBoard();
      }else if(k==='i'){e.preventDefault();
        this._cheats.invincible=!this._cheats.invincible;
        this.showToast(this._cheats.invincible?'INVINCIBLE ON':'INVINCIBLE OFF','#888');
      }else if(k==='t'){e.preventDefault();
        this._cheats.infTime=!this._cheats.infTime;
        if(this._cheats.infTime)this.game.timeRemaining=9999;
        this.showToast(this._cheats.infTime?'INFINITE TIME':'NORMAL TIME','#888');
        this.renderBoard();
      }else if(k==='s'){e.preventDefault();
        this.game.awardShards(100);
        this.showToast('+100 KEYS','#888');
        this.renderBoard();
      }else if(k==='w'){e.preventDefault();
        if(!this.timerInterval||this.game.gameOver)return;
        if(this.game.level>=this.game.totalDepths-1)return;
        this.stopTimer();
        this.game.gameWon=true;this.game.gameOver=true;
        this.showLevelComplete();
      }
    });
  }

  _openApp(view){
    if(view!=='sweeper'&&this._runActive)this.pauseGame();
    const existing=this.root.querySelector(`#exe-win-${view}`);

    document.body.classList.remove('exe-closed');

  // VHS timestamp — frozen date, clock ticks slowly
  _startVHSClock(){
    if(this._vhsInterval)return;
    this._vhsTicks=0;
    const fakeDate='JAN 15 1998';
    const baseH=3,baseM=47,baseS=22;
    this._vhsInterval=setInterval(()=>{
      this._vhsTicks++;
      const totalSec=baseS+Math.floor(this._vhsTicks/2);
      const s=totalSec%60;
      const m=(baseM+Math.floor(totalSec/60))%60;
      const h=(baseH+Math.floor((baseM+Math.floor(totalSec/60))/60))%12||12;
      const tsEl=document.getElementById('vhs-ts');
      if(tsEl)tsEl.textContent=`${fakeDate}  ${h}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')} AM`;
      const clockEl=document.getElementById('exe-clock');
      if(clockEl)clockEl.textContent=`${h}:${String(m).padStart(2,'0')} AM`;
    },500);
    // Sound button in taskbar
    this._bindTaskbarSound();
  }

  _bindTaskbarSound(){
    const wrap=this.root.querySelector('.exe-wrap');
    if(!wrap)return;
    wrap.addEventListener('click',e=>{
      const btn=e.target.closest('#exe-sound-btn');
      if(!btn)return;
      sfx.init();sfx.toggle();
      btn.classList.toggle('muted',sfx.muted);
      btn.textContent=sfx.muted?'Sound off':'Sound on';
    });

  // Keep taskbar app buttons in sync with open windows — clicking raises that window
  _syncTaskbarApps(){
    const bar=document.getElementById('exe-taskbar-apps');
    if(!bar)return;
    const LABELS={sweeper:'SWEEPER.EXE',lore:'LORE.HLP',lesson:'Learn to play',mycomp:'My Computer',recycle:'Recycle Bin',sysalert:'System Alert',terminal:'TERMINAL'};
    const ICONS={sweeper:'S',lore:'?',mycomp:'PC',recycle:'\u2718',sysalert:'!',terminal:'>_'};
    const wins=this.root.querySelectorAll('.exe-win');
    const apps=[];
    wins.forEach(w=>{

      const label=LABELS[id]||(id.startsWith('note-')?(w.dataset.noteLabel||'Notepad'):id);
      const ic=ICONS[id]||(id.startsWith('note-')?'\u{1F4DD}':'');

  // Render (or update) a named window with innerHTML. Creates if missing, raises to top.
  _renderWin(winId,innerHTML){
    this._ensureShell();
    const wrap=this.root.querySelector('.exe-wrap');
    let win=wrap.querySelector(`#exe-win-${winId}`);
    const isNew=!win;
    if(isNew){
      win=document.createElement('div');
      win.className='exe-win';
      win.id=`exe-win-${winId}`;
      win.dataset.winId=winId;
      wrap.appendChild(win);
    }
    win.ontouchstart=null;win.onkeydown=null;
    win.classList.remove('exe-game-window');win.innerHTML=innerHTML;win.scrollTop=0;
    this._applyWinPosition(winId);
    this._raiseWin(winId);
    this._syncClosedState();
    this._syncTaskbarApps();
    if(isNew)sfx.winOpen();
    return win;
  }

  // Bring a window to the front by assigning it the highest z-index
  _raiseWin(winId){
    this._zCounter=(this._zCounter||10)+1;
    // Reset counter to prevent z-index from exceeding CRT overlay layers (z-100+)
    if(this._zCounter>80){
      this._zCounter=10;
      this.root.querySelectorAll('.exe-win').forEach(w=>{w.style.zIndex=10;});
    }
    const win=this.root.querySelector(`#exe-win-${winId}`);
    if(!win)return;
    win.style.zIndex=this._zCounter;
    this.root.querySelectorAll('.exe-win').forEach(w=>{
      w.classList.toggle('exe-inactive',w!==win);
    });
  }

  // Remove a window from the DOM
  _closeWin(winId){
    const win=this.root.querySelector(`#exe-win-${winId}`);
    if(winId==='confirm')this._confirmAction=null;
    if(win){win.remove();sfx.winClose();}
    if(winId==='lesson'&&win){this._lesson=null;this._lessonReturnFocus?.focus({preventScroll:true});this._lessonReturnFocus=null;}
    // If SWEEPER closed during game, stop the timer
    if(winId==='sweeper'&&this._runActive){this.advanceClock();if(!this._paused)this._pausedAt=Date.now();this._paused=!this.game.gameOver;this.stopTimer();this._autosave();}
    if(winId==='share')document.querySelector('#modal button:not([disabled]),#resume-game')?.focus({preventScroll:true});
    this._syncClosedState();
    this._syncTaskbarApps();
  }

  // Keep body.exe-closed in sync with whether any window is open
  _syncClosedState(){
    const hasAny=!!this.root.querySelector('.exe-win');
    document.body.classList.toggle('exe-closed',!hasAny);
  }

  // Delegated handlers for the Win98 chrome — survives innerHTML rerenders.
  _bindExeChrome(){
    // Drag state
    let drag=null;

    const onDown=e=>{
      if(!document.body.classList.contains('exe-mode'))return;
      // Titlebar drag has priority (it contains buttons we want to ignore)
      const tbar=e.target.closest('.exe-titlebar');
      const btn=e.target.closest('.exe-tbtn');
      let el=null,kind=null,id=null;
      if(tbar&&!btn){
        const win=tbar.closest('.exe-win');
        if(win&&win.closest('.exe-wrap')&&win.dataset.winId){
          el=win;kind='win';id=win.dataset.winId;
          this._raiseWin(id);
          this._syncTaskbarApps();
        }
      }
      if(!el){
        const icon=e.target.closest('.exe-desk-icon');
        if(icon){el=icon;kind='icon';id=icon.dataset.icon;}
      }
      if(!el)return;
      const touch=e.touches&&e.touches[0];
      const cx=touch?touch.clientX:e.clientX;
      const cy=touch?touch.clientY:e.clientY;
      const parent=el.offsetParent||el.parentElement;
      const pr=parent.getBoundingClientRect();
      const ir=el.getBoundingClientRect();
      const ps=getComputedStyle(parent);
      const bl=parseFloat(ps.borderLeftWidth)||0;
      const bt=parseFloat(ps.borderTopWidth)||0;
      // Measure from visual rect so transforms resolve correctly
      const origX=ir.left-pr.left-bl;
      const origY=ir.top-pr.top-bt;
      drag={el,kind,id,startX:cx,startY:cy,origX,origY,moved:false,pw:parent.clientWidth,ph:parent.clientHeight,w:ir.width,h:ir.height};
      if(touch)e.preventDefault();
    };
    const onMove=e=>{
      if(!drag)return;
      const touch=e.touches&&e.touches[0];
      const cx=touch?touch.clientX:e.clientX;
      const cy=touch?touch.clientY:e.clientY;
      const dx=cx-drag.startX,dy=cy-drag.startY;
      if(!drag.moved&&(Math.abs(dx)>4||Math.abs(dy)>4))drag.moved=true;
      if(drag.moved){
        const nx=Math.max(0,Math.min(drag.pw-drag.w,drag.origX+dx));
        const ny=Math.max(0,Math.min(drag.ph-drag.h,drag.origY+dy));
        drag.el.style.left=nx+'px';drag.el.style.top=ny+'px';
        drag.el.style.right='auto';drag.el.style.bottom='auto';drag.el.style.transform='none';
        drag.lastX=nx;drag.lastY=ny;
        if(touch)e.preventDefault();
      }
    };
    const onUp=()=>{
      if(!drag)return;
      if(drag.moved){
        if(drag.kind==='win'){
          this._winPos=this._winPos||{};
          this._winPos[drag.id]={x:drag.lastX,y:drag.lastY};
          this._saveWinPos();
        }else{
          this._iconPositions=this._iconPositions||{};
          this._iconPositions[drag.id]={x:drag.lastX,y:drag.lastY};
          this._saveIconPositions();
          const dragged=drag.el;
          drag.el._wasDragged=true;
          setTimeout(()=>{if(dragged)dragged._wasDragged=false;},120);
        }
      }
      drag=null;
    };

    document.addEventListener('mousedown',onDown);
    document.addEventListener('mousemove',onMove);
    document.addEventListener('mouseup',onUp);
    document.addEventListener('touchstart',onDown,{passive:false});
    document.addEventListener('touchmove',onMove,{passive:false});
    document.addEventListener('touchend',onUp);

    // Click handler (capture phase to intercept drag-clicks)
    document.addEventListener('click',e=>{
      if(!document.body.classList.contains('exe-mode'))return;
      const icon=e.target.closest('.exe-desk-icon');
      if(icon&&icon._wasDragged){e.preventDefault();e.stopPropagation();return;}
      // Reload button → brief overlay then reopen instantly (no loader)
      if(e.target.closest('.exe-reload-btn')){
        e.preventDefault();e.stopPropagation();
        const win=e.target.closest('.exe-win');
        if(win&&win.dataset.winId&&!win.querySelector('.exe-reload-overlay')){
          const winId=win.dataset.winId;
          const ov=document.createElement('div');
          ov.className='exe-reload-overlay';
          ov.innerHTML='<div class="exe-reload-msg">Reloading...</div>';
          win.appendChild(ov);
          const SHOW={sweeper:()=>this.showStart(),lore:()=>this.showCodex(),mycomp:()=>this.showMyComputer(),recycle:()=>this.showRecycleBin(),terminal:()=>this.showTerminal()};
          setTimeout(()=>{
            this._closeWin(winId);
            document.body.classList.remove('exe-closed');
            (SHOW[winId]||SHOW.sweeper)();
          },600);
        }
        return;
      }
      // Close button → close only that specific window
      if(e.target.closest('.exe-close-btn')){
        e.preventDefault();e.stopPropagation();
        const win=e.target.closest('.exe-win');
        if(win&&win.dataset.winId){
          sfx.init&&sfx.init();
          if(win.dataset.winId==='sysalert'){this._dismissSysAlert();}
          else{this._closeWin(win.dataset.winId);}
        }
        return;
      }
      // SWEEPER.EXE icon → raise existing window or open with loading delay
      if(e.target.closest('#exe-desk-sweeper')){
        e.preventDefault();e.stopPropagation();
        sfx.init&&sfx.init();
        if(this.root.querySelector('#exe-win-sweeper'))this._raiseWin('sweeper');
        else this._openApp('sweeper');
        return;
      }
      // LORE.HLP icon
      if(e.target.closest('#exe-desk-lore')){
        e.preventDefault();e.stopPropagation();
        sfx.init&&sfx.init();
        if(this.root.querySelector('#exe-win-lore'))this._raiseWin('lore');
        else this._openApp('lore');
        return;
      }
      // My Computer icon
      if(e.target.closest('#exe-desk-mycomp')){
        e.preventDefault();e.stopPropagation();
        sfx.init&&sfx.init();
        if(this.root.querySelector('#exe-win-mycomp'))this._raiseWin('mycomp');
        else this._openApp('mycomp');
        return;
      }
      // Recycle Bin icon
      if(e.target.closest('#exe-desk-recycle')){
        e.preventDefault();e.stopPropagation();
        sfx.init&&sfx.init();
        if(this.root.querySelector('#exe-win-recycle'))this._raiseWin('recycle');
        else this._openApp('recycle');
        return;
      }
      if(e.target.closest('#exe-desk-terminal')){
        e.preventDefault();e.stopPropagation();
        sfx.init&&sfx.init();
        if(this.root.querySelector('#exe-win-terminal'))this._raiseWin('terminal');
        else this._openApp('terminal');
        return;
      }
      // Start button — sluggish like a real 486
      if(e.target.closest('#exe-start-btn')){
        e.preventDefault();e.stopPropagation();
        const menu=this.root.querySelector('#exe-start-menu');
        const btn=this.root.querySelector('#exe-start-btn');
        if(menu.classList.contains('open')){
          menu.classList.remove('open');btn.classList.remove('open');
        }else{
          btn.classList.add('open');sfx.menuOpen();
          setTimeout(()=>menu.classList.add('open'),300);
        }
        return;
      }
      // Start menu items
      const startItem=e.target.closest('[data-start-action]');
      if(startItem){
        e.preventDefault();e.stopPropagation();
        this.root.querySelector('#exe-start-menu').classList.remove('open');
        this.root.querySelector('#exe-start-btn').classList.remove('open');
        const action=startItem.dataset.startAction;
        if(action==='restart'||action==='shutdown')this._doRestart();
        return;
      }
      // Close start menu on any other click
      const startMenu=this.root.querySelector('#exe-start-menu');
      if(startMenu&&startMenu.classList.contains('open')){
        startMenu.classList.remove('open');
        this.root.querySelector('#exe-start-btn').classList.remove('open');
      }
      if(e.target.closest('#exe-desk-about')){
        e.preventDefault();e.stopPropagation();
        sfx.init&&sfx.init();
        document.body.classList.remove('exe-closed');
        this.showNotepad('AUTHOR.TXT','SWEEPER.EXE v4.0.1\nby Thomas Ou\n\n─────────────────────────\n\nWeb:      thomasou.com\nGitHub:   github.com/Smokeybear10\nLinkedIn: linkedin.com/in/thomasou0\n\n─────────────────────────\n\nLook in project files for help...\nSome answers are hidden in plain sight.');
        return;
      }
      // Taskbar app button — raise or reopen that window
      const taskBtn=e.target.closest('[data-taskbar-win]');
      if(taskBtn){
        e.preventDefault();e.stopPropagation();
        const winId=taskBtn.dataset.taskbarWin;
        if(this.root.querySelector(`#exe-win-${winId}`)){
          this._raiseWin(winId);
          this._syncTaskbarApps();
        }
        return;
      }
      // Clicking anywhere on a window raises it to the front
      const winHit=e.target.closest('.exe-win');
      if(winHit&&winHit.dataset.winId&&winHit.classList.contains('exe-inactive')){
        this._raiseWin(winHit.dataset.winId);
        this._syncTaskbarApps();
      }
    },true);
  }

  setFlavor(text){document.getElementById('flavor-text').textContent=text;}

  showStart(){
    this.stopTimer();this._runActive=false;this._paused=false;
    const saved=readStored('sweeper_autosave',null);

      <div class="exe-launcher">

  showLesson(restart=false){
    if(!restart&&document.getElementById('exe-win-lesson')){this._raiseWin('lesson');return;}
    if(!restart)this._lessonReturnFocus=document.activeElement;
    this.pauseGame();
    const game=new Game();
    game.rows=4;game.cols=4;game.mineCount=2;game.firstClick=false;
    game.board=Array.from({length:4},(_,r)=>Array.from({length:4},(_,c)=>({mine:r===0&&c===1||r===3&&c===0,revealed:false,flagged:false,adjacent:0})));
    for(let r=0;r<4;r++)for(let c=0;c<4;c++)game.board[r][c].adjacent=game.countAdj(r,c);
    this._lesson={game,step:0,mode:'reveal',focus:10};
    this._renderLesson();
  }

  _renderLesson(){
    const lesson=this._lesson;if(!lesson)return;
    const g=lesson.game,done=g.gameWon;
    const steps=[
      {title:'Open a safe area',text:'Reveal the marked Start tile. Empty tiles open their safe neighbors too.',r:2,c:2,mode:'reveal'},
      {title:'Read a number',text:'Choose Inspect, then select the outlined 1. It touches one mine, including diagonally.',r:0,c:2,mode:'inspect'},
      {title:'Mark the mine',text:'That 1 has only one covered neighbor. Choose Flag and mark the outlined tile.',r:0,c:1,mode:'flag'},
      {title:'Clear around a clue',text:'This 1 now has one flag beside it. Choose Reveal and select the outlined 1 to open its other neighbors.',r:1,c:1,mode:'reveal'}
    ];
    const step=steps[Math.min(lesson.step,3)];
    const saved=readStored('sweeper_autosave',null);
    const win=this._renderWin('lesson',`
      <div class="exe-titlebar"><div class="exe-ttext">Learn to play</div><div class="exe-tbtns"><button class="exe-tbtn exe-close-btn" aria-label="Close lesson">&times;</button></div></div>
      <div class="lesson-content ${done?'lesson-complete':''}">
        <div class="lesson-heading"><span>${done?'Complete':'Step '+(lesson.step+1)+' of 4'}</span><span>No timer · separate practice board</span></div>
        <section class="lesson-instruction" aria-live="polite" aria-atomic="true"><h2 id="lesson-title">${done?'Every safe tile is clear':step.title}</h2><p>${done?'You cleared all 14 safe tiles. The two covered tiles were mines; you only needed to flag one of them.':step.text}</p></section>
        <div class="lesson-board" role="grid" aria-label="Practice minefield" aria-rowcount="4" aria-colcount="4">${g.board.map((row,r)=>row.map((cell,c)=>{
          const target=!done&&r===step.r&&c===step.c;
          const neighbor=!done&&lesson.step===2&&Math.abs(r)<=1&&Math.abs(c-2)<=1&&(r!==0||c!==2);
          const label=cell.flagged?'Flagged':cell.revealed?cell.adjacent+' adjacent mines':done&&cell.mine?'Mine':'Covered';
          const text=cell.flagged?ICONS.stake:cell.revealed?(cell.adjacent?`<span style="color:${NUM_COLORS[cell.adjacent]}">${cell.adjacent}</span>`:''):done&&cell.mine?ICONS.skull:lesson.step===0&&target?'Start':'';
          return `<button class="cell ${cell.revealed?'revealed':'unrevealed'} ${cell.flagged?'flagged':''} ${target?'lesson-target':''} ${lesson.step===0&&target?'lesson-start':''} ${neighbor?'inspect-neighbor':''} ${lesson.step===2&&r===0&&c===2?'inspect-source':''} ${done&&cell.mine?'review-mine':''}" data-r="${r}" data-c="${c}" role="gridcell" aria-rowindex="${r+1}" aria-colindex="${c+1}" aria-label="Row ${r+1}, column ${c+1}: ${label}${target?', next move':''}" tabindex="${!done&&r*4+c===lesson.focus?'0':'-1'}">${text}</button>`;
        }).join('')).join('')}</div>
        ${done?`<p class="lesson-next">In a run, your first reveal starts the clock. Clear four boards and spend your keys on tools between levels.</p><div class="lesson-actions"><button class="exe-btn" id="lesson-again">Practice again</button><button class="exe-btn default" id="lesson-play">${this._runActive?'Back to game':this._validSave(saved)?'Resume run':'Play a run'}</button></div>`:
        `<div class="lesson-modes" role="group" aria-label="Practice action">${['reveal','flag','inspect'].map(mode=>`<button class="exe-btn ${mode===step.mode?'lesson-suggested':''}" data-lesson-mode="${mode}" aria-pressed="${lesson.mode===mode}">${mode[0].toUpperCase()+mode.slice(1)}</button>`).join('')}</div><p class="lesson-feedback" role="status">${lesson.step===0?'This lesson leaves your saved games untouched.':lesson.step===2?'Only the covered tile can contain that mine.':lesson.step===3?'Matching flags let you clear several tiles in one move.':'Inspect reads a clue without opening anything.'}</p>`}
      </div>`);
    win.setAttribute('role','dialog');win.setAttribute('aria-labelledby','lesson-title');
    const board=win.querySelector('.lesson-board');
    const act=e=>{const cell=e.target.closest('.cell');if(cell)this._lessonAction(+cell.dataset.r,+cell.dataset.c);};
    board.addEventListener('click',act);
    board.addEventListener('contextmenu',e=>{e.preventDefault();const cell=e.target.closest('.cell');if(cell)this._lessonAction(+cell.dataset.r,+cell.dataset.c,'flag');});
    board.addEventListener('focusin',e=>{const cell=e.target.closest('.cell');if(!cell)return;lesson.focus=+cell.dataset.r*4+(+cell.dataset.c);board.querySelectorAll('.cell').forEach(el=>el.tabIndex=el===cell?0:-1);});
    board.addEventListener('keydown',e=>{
      const cell=e.target.closest('.cell');if(!cell||done)return;
      const r=+cell.dataset.r,c=+cell.dataset.c;
      if(e.key.toLowerCase()==='f'){e.preventDefault();this._lessonAction(r,c,'flag');return;}
      const offsets={ArrowUp:[-1,0],ArrowDown:[1,0],ArrowLeft:[0,-1],ArrowRight:[0,1]};
      const offset=offsets[e.key];if(!offset)return;
      e.preventDefault();board.children[Math.max(0,Math.min(3,r+offset[0]))*4+Math.max(0,Math.min(3,c+offset[1]))]?.focus();
    });
    win.onkeydown=e=>{if(e.key==='Escape'){e.preventDefault();e.stopPropagation();this._closeWin('lesson');}};
    win.querySelectorAll('[data-lesson-mode]').forEach(button=>button.addEventListener('click',()=>{
      lesson.mode=button.dataset.lessonMode;lesson.focus=step.r*4+step.c;this._renderLesson();
    }));
    win.querySelector('#lesson-again')?.addEventListener('click',()=>this.showLesson(true));
    win.querySelector('#lesson-play')?.addEventListener('click',()=>{
      this._closeWin('lesson');
      const latestSave=readStored('sweeper_autosave',null);
      if(this._runActive)this._openApp('sweeper');
      else if(this._validSave(latestSave))this._restoreSave(latestSave);
      else this._newRun();
    });
    (done?win.querySelector('#lesson-play'):board.children[lesson.focus])?.focus({preventScroll:true});
  }

  _lessonAction(r,c,mode=this._lesson?.mode){
    const lesson=this._lesson;if(!lesson||lesson.game.gameWon)return;
    const moves=[{r:2,c:2,mode:'reveal'},{r:0,c:2,mode:'inspect'},{r:0,c:1,mode:'flag'},{r:1,c:1,mode:'reveal'}];
    const move=moves[lesson.step];
    if(r!==move.r||c!==move.c||mode!==move.mode){
      const hint=document.querySelector('#exe-win-lesson .lesson-feedback');
      if(hint)hint.textContent=`Choose ${move.mode[0].toUpperCase()+move.mode.slice(1)}, then select the outlined ${lesson.step===0?'Start tile':lesson.step===1||lesson.step===3?'1':'covered tile'}.`;
      return;
    }
    sfx.init();
    if(lesson.step===0){lesson.game.reveal(r,c);sfx.reveal();}
    if(lesson.step===2){lesson.game.toggleFlag(r,c);sfx.flag();}
    if(lesson.step===3){lesson.game.chord(r,c);sfx.chordSuccess();}
    lesson.step++;
    const next=moves[lesson.step];if(next)lesson.focus=next.r*4+next.c;
    if(lesson.game.gameWon){writeStored('sweeper_learned',true);sfx.levelComplete();}
    this._renderLesson();
  }

  showSystemAlert(sessionStr){
    if(!sessionStr){
      const sessions=parseInt(localStorage.getItem('sweeper_sessions')||'47',10);
      sessionStr=String(sessions).padStart(5,'0');
    }
    const winHTML=`
    <div class="exe-titlebar exe-titlebar-alert"><div class="exe-ttext"><span>System Alert</span></div><div class="exe-tbtns"><button class="exe-tbtn exe-close-btn" title="Close window" aria-label="Close">&times;</button></div></div>

      <div class="exe-modal-icon">!</div>

    </div>
    <div class="exe-btn-row"><button class="exe-btn default" id="sysalert-ok">Continue</button><button class="exe-btn" id="sysalert-cancel">Cancel</button></div>`;
    const win=this._renderWin('sysalert',winHTML);
    sfx.error();
    win.querySelector('#sysalert-ok').addEventListener('click',()=>this._dismissSysAlert());
    win.querySelector('#sysalert-cancel').addEventListener('click',()=>this._dismissSysAlert());
  }

  _dismissSysAlert(){
    const wasFirst=!this._modalDismissed;
    this._modalDismissed=true;
    this._closeWin('sysalert');
    const msg=document.querySelector('#exe-win-sweeper #exe-sb-msg');
    if(msg)msg.innerHTML='<span class="exe-dot"></span>READY';
    if(wasFirst)this._raiseWin('sweeper');
  }

  showMyComputer(path){
    path=path||'C:\\';
    const fs=this._FS();
    const items=fs[path]||[];
    const filesHTML=items.map((f,i)=>{
      const ico=f.icon.length<=2?`<span class="exe-fi" style="font-size:11px;">${f.icon}</span>`:`<span class="exe-fi">${f.icon}</span>`;
      return `<div class="exe-list-item" data-fs-idx="${i}" data-fs-type="${f.type}" data-fs-path="${f.path||''}" role="button" tabindex="0" aria-label="${f.name}">${ico}<span class="exe-name">${f.name}</span><span class="exe-size">${f.size}</span></div>`;
    }).join('');
    const winHTML=`
    <div class="exe-titlebar">
      <div class="exe-ttext"><span class="exe-ic">PC</span>${path==='C:\\'?'My Computer':path}</div>
      <div class="exe-tbtns"><button class="exe-tbtn exe-reload-btn" title="Reload" aria-label="Reload">&#x21BB;</button><button class="exe-tbtn exe-close-btn" title="Close" aria-label="Close">&times;</button></div>
    </div>
    <div class="exe-client" style="padding:0;">
      <div style="background:#EAEAEA;padding:3px 8px;font-size:10px;font-weight:700;border-bottom:1px solid #6E6E6E;font-family:'Tahoma',sans-serif;color:#000;">
        Address: <span style="font-weight:400;font-family:'JetBrains Mono',monospace;font-size:10px;">${path}</span>
      </div>
      <div class="exe-listbox" style="min-height:200px;max-height:300px;overflow-y:auto;" id="mc-files">${filesHTML}</div>
    </div>
    <div class="exe-status">
      <div class="exe-sb-cell">${items.filter(f=>f.type!=='up').length} object(s)</div>
      <div class="exe-sb-cell">(C:) Local Disk</div>
    </div>`;
    const win=this._renderWin('mycomp',winHTML);
    win.querySelector('#mc-files').addEventListener('click',e=>{
      const row=e.target.closest('.exe-list-item');if(!row)return;
      const type=row.dataset.fsType;
      const idx=parseInt(row.dataset.fsIdx,10);
      const f=items[idx];if(!f)return;
      if(type==='up'){this.showMyComputer(f.path);return;}
      if(type==='folder'){
        const sub=path.endsWith('\\')?path+f.name:path+'\\'+f.name;
        if(fs[sub])this.showMyComputer(sub);
        return;
      }
      // Clickable apps — open the real thing
      const nm=f.name.toUpperCase();
      if(nm==='SWEEPER.EXE'||type==='shortcut'&&nm==='SWEEPER.EXE'){this._openApp('sweeper');return;}
      if(nm==='LORE.HLP'||type==='shortcut'&&nm==='LORE.HLP'){this._openApp('lore');return;}
      if(type==='save'){this._loadSaveFile(f.name);return;}
      if(f.content)this.showNotepad(f.name,f.content);
    });
  }

  showNotepad(filename,content){
    // Each notepad gets a unique window id so you can open several
    const winId='note-'+filename.replace(/[^a-zA-Z0-9]/g,'').toLowerCase();
    // If already open, just raise
    if(this.root.querySelector(`#exe-win-${winId}`)){this._raiseWin(winId);return;}
    const escaped=content.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    const winHTML=`
    <div class="exe-titlebar">
      <div class="exe-ttext"><span class="exe-ic" style="font-size:8px;">\u{1F4DD}</span>${filename} - Notepad</div>
      <div class="exe-tbtns"><button class="exe-tbtn exe-close-btn" title="Close">&times;</button></div>
    </div>
    <div style="background:#FFF;border:1px solid #000;box-shadow:inset 1px 1px 0 #404040,inset -1px -1px 0 #EFEFEF;padding:8px 10px;min-height:120px;max-height:260px;overflow-y:auto;font-family:'JetBrains Mono',monospace;font-size:11px;color:#000;white-space:pre-wrap;line-height:1.55;">${escaped}</div>`;
    const win=this._renderWin(winId,winHTML);
    win.dataset.noteLabel=filename;
  }

  showTerminal(){
    const winHTML=`
    <div class="exe-titlebar">
      <div class="exe-ttext"><span class="exe-ic" style="font-size:9px;">&gt;_</span>TERMINAL</div>
      <div class="exe-tbtns"><button class="exe-tbtn exe-reload-btn" title="Reload" aria-label="Reload">&#x21BB;</button><button class="exe-tbtn exe-close-btn" title="Close" aria-label="Close">&times;</button></div>

      <div class="term-line">SWEEPER Terminal v4.0.1</div>

      <div class="term-line">&nbsp;</div>
      <div class="term-line">Type <span class="term-info">HELP</span> for a list of commands.</div>
      <div class="term-line">&nbsp;</div>
    </div>
    <div class="term-input-row">

    </div>
    <div class="exe-status"><div class="exe-sb-cell">TERMINAL &mdash; ready</div></div>`;
    const win=this._renderWin('terminal',winHTML);
    const input=win.querySelector('#term-input');
    const output=win.querySelector('#term-output');
    input.focus();
    const self=this;
    const COMMANDS={
      help:()=>'<span class="term-info">Available commands:</span>\n  HELP        Show this list\n  CLEAR       Clear terminal\n  VER         Show version\n  DIR         List files\n  STATUS      Show game state\n  ECHO [msg]  Echo a message\n  RESTART     Restart the system\n\n<span class="term-warn">Some inputs are not commands.</span>',
      restart:()=>{setTimeout(()=>self._doRestart(),500);return'<span class="term-warn">Restarting system...</span>';},
      clear:()=>{output.innerHTML='';return null;},
      ver:()=>'SWEEPER.EXE v4.0.1\nBLITZ NECROTRON BIOS v2.04.1997\nSession '+String(parseInt(localStorage.getItem('sweeper_sessions')||'47',10)).padStart(5,'0'),
      dir:()=>'C:\\PROGRAM FILES\\SWEEPER\n\n  SWEEPER.EXE    248 KB\n  LORE.HLP        12 KB\n  genesis.dll     12 KB\n  solomon.dll     28 KB\n  lazarus.dll     20 KB\n  samson.dll      36 KB\n  eden.dll        44 KB\n  manna.dll       52 KB\n  ????????.dll     0 KB\n\n  8 file(s)',
      status:()=>{
        const g=self.game;
        return`  Module:  ${classById(g.gameClass).name}\n  Level:   ${g.level+1}/${g.totalDepths}\n  Keys:    ${g.shards}\n  Hard:    ${g.hardMode?'YES':'NO'}`;
      },
      echo:(args)=>escapeHTML(args||''),
    };
    const SECRETS={
      'APPLE':()=>{
        if(localStorage.getItem('sweeper_hardUnlocked')==='1')return'<span class="term-warn">ROOT.ACCESS is already active.</span>';
        localStorage.setItem('sweeper_hardUnlocked','1');
        return'<span class="term-ok">Authenticating...</span>\n<span class="term-ok">ROOT.ACCESS granted.</span>\n\n<span class="term-info">Deeper partitions now accessible.</span>\n<span class="term-info">Five levels. Modifiers active. No mercy.</span>\n\n<span class="term-warn">Restart SWEEPER.EXE to apply.</span>';
      },
      'SNAKE':()=>{
        if(localStorage.getItem('sweeper_cheatsUnlocked')==='1')return'<span class="term-warn">Dev mode is already active.</span>';
        localStorage.setItem('sweeper_cheatsUnlocked','1');
        return'<span class="term-ok">Dev mode enabled.</span>\n\n<span class="term-info">Cheat codes are now active.</span>\n<span class="term-info">See CHEATS.TXT for key bindings.</span>';
      },
    };
    input.addEventListener('keydown',e=>{
      if(e.key!=='Enter')return;
      const raw=input.value.trim();input.value='';
      if(!raw)return;
      const parts=raw.split(/\s+/);
      const cmd=parts[0].toLowerCase();
      const args=parts.slice(1).join(' ');
      const echo=document.createElement('div');
      echo.className='term-line';echo.innerHTML='<span class="term-ok">C:\\&gt;</span> '+raw.replace(/</g,'&lt;');
      output.appendChild(echo);
      const secret=SECRETS[raw.trim().toUpperCase()];
      if(secret){
        const out=document.createElement('div');
        out.className='term-line';out.innerHTML=secret();
        output.appendChild(out);
      }else{
        const handler=COMMANDS[cmd];
        if(handler){
          const result=handler(args);
          if(result!==null&&result!==undefined){
            const out=document.createElement('div');
            out.className='term-line';out.innerHTML=result;
            output.appendChild(out);
          }
        }else{
          const out=document.createElement('div');
          out.className='term-line';out.innerHTML='<span class="term-err">Bad command or file name: '+cmd.replace(/</g,'&lt;')+'</span>';
          output.appendChild(out);
        }
      }
      const spacer=document.createElement('div');
      spacer.className='term-line';spacer.innerHTML='&nbsp;';
      output.appendChild(spacer);
      output.scrollTop=output.scrollHeight;
    });
    win.addEventListener('click',()=>input.focus());
  }

  startLevel(){
    this.stopTimer();this.dangerFlavorShown=false;this._runActive=true;this._paused=false;this._shopItems=null;this.comboCount=0;this.lastRevealTime=0;this._focusCell={r:0,c:0};
    if(this.game.dailyDate)this._focusCell={r:DAILY_BOARD.startRow,c:DAILY_BOARD.startCol};
    this.levelStartTime=Date.now();this.inputMode='reveal';this._pausedBoardScroll=null;
    const line=NARRATOR.react('startLevel',{level:this.game.level});
    if(line)this.setFlavor(line);
    this.renderBoard();this.startTimer();
    if(this.game.dailyDate)document.querySelector('#grid .daily-start')?.focus({preventScroll:true});
  }
